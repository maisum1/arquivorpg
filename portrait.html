<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portrait Transparente</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
        
        /* FORÇA TRANSPARÊNCIA TOTAL NO NAVEGADOR E NO OBS */
        html, body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: none !important; 
            background-color: transparent !important;
        }

        #main-wrapper { 
            display: flex; flex-direction: row; align-items: flex-end; 
            padding: 20px; gap: 25px; 
            background: transparent !important;
        }
        
        /* CAIXA DO PORTRAIT: mesma proporção do retrato da ficha (≈ 0,79), para o recorte ser idêntico */
        #image-frame { 
            position: relative; 
            width: 276px; 
            height: 350px; 
            overflow: hidden; 
            background: transparent !important;
            border: none;
        }
        
        #personagem-img { 
            position: absolute; 
            left: 0; top: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* valor inicial; o enquadramento real é calculado em enquadrar() */
            max-width: none;
            background: transparent !important;
            transition: left 0.3s ease-out, top 0.3s ease-out, width 0.3s ease-out, height 0.3s ease-out;
            /* O Filtro drop-shadow não cria fundo preto, diferente de box-shadow */
            filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.8));
        }

        /* TEXTOS */
        #stats-container { display: flex; flex-direction: column; margin-left: -40px; position: relative; z-index: 10; pointer-events: none; }
        #nome-val { font-size: 40px; text-transform: uppercase; color: white; text-shadow: 2px 2px 2px #000, 0 0 8px #ff0000, 0 0 8px #ff0000, 0 0 8px #ff0000; font-family: 'Special Elite'; margin-bottom: 5px; }
        #vida-text { font-size: 36px; color: white; text-shadow: 2px 2px 2px #000, 0 0 8px #ff0000, 0 0 8px #ff0000, 0 0 8px #ff0000; margin-left: 15px; }
        #san-text { font-size: 36px; color: white; text-shadow: 2px 2px 2px #000, 0 0 8px #0066ff, 0 0 8px #0066ff, 0 0 8px #0066ff; margin-left: 30px; }
        #pe-container { position: absolute; bottom: 10px; left: 10px; font-size: 40px; color: #f5e6fc; text-shadow: 2px 2px 2px #000, 0 0 8px #cc66ff, 0 0 8px #cc66ff, 0 0 8px #cc66ff; z-index: 10; font-family: 'Special Elite'; }
    </style>
</head>
<body>
    <div id="main-wrapper">
        <div id="image-frame">
            <img id="personagem-img" src="">
            <div id="pe-container"><span id="pe-val">0</span></div>
        </div>
        <div id="stats-container">
            <div id="nome-val">...</div>
            <div id="vida-text">0/0</div>
            <div id="san-text">0/0</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzOGimCx5mgObg1ulI0SdnbyS0zlU-DkI",
            authDomain: "fichasrpg-7fc69.firebaseapp.com",
            projectId: "fichasrpg-7fc69",
            storageBucket: "fichasrpg-7fc69.firebasestorage.app",
            messagingSenderId: "758802032764",
            appId: "1:758802032764:web:40467e15fdc24c570081f9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        // ?nome=completo mostra o nome inteiro; por padrão aparece só o primeiro nome
        const nomeCompleto = params.get('nome') === 'completo';

        // Enquadramento: zoom 1 = a imagem preenche a moldura; abaixo disso aparece o resto da imagem (igual à ficha)
        let enq = { z: 1, x: 50, y: 50 };
        function enquadrar() {
            const img = document.getElementById('personagem-img'), box = img.parentElement;
            const nw = img.naturalWidth, nh = img.naturalHeight, w = box.clientWidth, h = box.clientHeight;
            if (!nw || !nh) return;
            const s = Math.max(w / nw, h / nh) * enq.z, iw = nw * s, ih = nh * s;
            Object.assign(img.style, { objectFit: 'fill', transform: 'none', width: iw + 'px', height: ih + 'px',
                left: ((w - iw) * enq.x / 100) + 'px', top: ((h - ih) * enq.y / 100) + 'px' });
        }
        document.getElementById('personagem-img').addEventListener('load', enquadrar);

        if (id) {
            db.collection("fichas").doc(id).onSnapshot(doc => {
                const d = doc.data();
                if(!d) return;

                const nomeBruto = (d.nome || "Persona").trim();
                document.getElementById('nome-val').innerText = nomeCompleto ? nomeBruto : (nomeBruto.split(/\s+/)[0] || "Persona");
                document.getElementById('pe-val').innerText = d.peAtual || 0;
                document.getElementById('vida-text').innerText = `${d.vidaAtual}/${d.vidaMax}`;
                document.getElementById('san-text').innerText = `${d.sanAtual}/${d.sanMax}`;

                let estado = "Normal";
                if (d.vidaAtual <= 0) estado = "Morto";
                else if (d.sanAtual <= 0) estado = "Enlouquecendo";
                else if ((d.vidaAtual / d.vidaMax) <= 0.5) estado = "Machucado";

                const imgFinal = d["portrait" + estado] || d.portraitNormal || d.portrait;
                const imgEl = document.getElementById('personagem-img');
                
                if(imgFinal && imgEl.src !== imgFinal) {
                    imgEl.src = imgFinal;
                }

                // VALORES SALVOS NA FICHA (se a imagem vem do retrato principal, vale o enquadramento principal: pX/pY/pZ)
                const doPrincipal = !d["portrait" + estado] && !d.portraitNormal;
                const num = v => { const n = parseFloat(v); return isNaN(n) ? undefined : n; };
                enq = {
                    z: num(d["p" + estado + "Zoom"]) ?? (doPrincipal ? num(d.pZ) : undefined) ?? num(d.pZ) ?? 1,
                    x: num(d["p" + estado + "X"]) ?? (doPrincipal ? num(d.pX) : undefined) ?? 50,
                    y: num(d["p" + estado + "Y"]) ?? (doPrincipal ? num(d.pY) : undefined) ?? 50
                };
                enquadrar();
            });
        }
    </script>
</body>
</html>
