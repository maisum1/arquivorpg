<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>A.R.Q.U.I.V.O. - Portrait OBS</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Text:ital,wght@0,700;1,700&family=Oswald:wght@600;700&family=Permanent+Marker&family=Special+Elite&display=swap');

        /* Transparência absoluta para Browser Source no OBS */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: none !important;
            background-color: transparent !important;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            /* PV: Vermelho Sangue Vibrante */
            --hp-glow: #d9141b;
            --hp-mid: #8f080d;
            --hp-core: #fff2f2;

            /* Lucidez: Azul Profundo */
            --san-glow: #1b56b5;
            --san-mid: #0d2d66;
            --san-core: #eef5ff;

            /* Fôlego: Amarelo Queimado / Marrom Ocre da Ficha de Persona */
            --pe-glow: #9e6518;
            --pe-mid: #664922;
            --pe-bright: #e09f3e;
            --pe-core: #fff3db;
        }

        #main-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: row;
            align-items: flex-end;
            padding: 28px 48px 30px 34px;
            background: transparent !important;
        }

        /* =========================================================
           MOLDURA ORGÂNICA DO PERSONAGEM + AURA DE NÉVOA (MAEL/ZURI)
           ========================================================= */
        #character-stage {
            position: relative;
            width: 245px;
            height: 335px;
            flex-shrink: 0;
        }

        /* Névoa sutil na base do busto para integrar com a câmera do OBS */
        #character-stage::after {
            content: "";
            position: absolute;
            left: -8%;
            right: -8%;
            bottom: -4%;
            height: 42%;
            pointer-events: none;
            z-index: 12;
            background:
                radial-gradient(ellipse at 50% 78%, rgba(215, 225, 220, 0.22) 0%, rgba(160, 175, 170, 0.08) 45%, transparent 72%),
                radial-gradient(ellipse at 30% 88%, rgba(200, 210, 205, 0.16) 0%, transparent 55%);
            filter: blur(8px);
            mix-blend-mode: screen;
            transition: all 0.5s ease;
        }

        body.estado-machucado #character-stage::after {
            background:
                radial-gradient(ellipse at 50% 78%, rgba(200, 20, 25, 0.35) 0%, rgba(120, 10, 12, 0.14) 48%, transparent 74%);
        }
        body.estado-choque #character-stage::after {
            background:
                radial-gradient(ellipse at 50% 78%, rgba(35, 95, 195, 0.32) 0%, rgba(18, 45, 110, 0.14) 48%, transparent 74%);
        }

        #image-frame {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            /* Máscara orgânica esfumaçada na base e bordas */
            -webkit-mask-image: radial-gradient(ellipse 92% 90% at 50% 44%, #000 64%, rgba(0,0,0,0.65) 82%, transparent 100%);
            mask-image: radial-gradient(ellipse 92% 90% at 50% 44%, #000 64%, rgba(0,0,0,0.65) 82%, transparent 100%);
        }

        #personagem-img {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            background: transparent !important;
            transition: width 0.25s ease, height 0.25s ease, left 0.25s ease, top 0.25s ease, filter 0.45s ease;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.92)) drop-shadow(0 0 12px rgba(0, 0, 0, 0.6));
        }

        body.estado-machucado #personagem-img {
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(210, 15, 22, 0.9)) contrast(1.06);
            animation: pulseBloodOBS 2.4s infinite ease-in-out;
        }
        body.estado-choque #personagem-img {
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(38, 102, 210, 0.9)) saturate(0.65) contrast(1.12);
        }
        body.estado-morto #personagem-img {
            filter: grayscale(100%) contrast(1.25) brightness(0.6) drop-shadow(0 6px 16px #000);
        }

        @keyframes pulseBloodOBS {
            0%, 100% { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 12px rgba(200,15,20,0.75)); }
            50%      { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 24px rgba(255,25,30,1)); }
        }

        /* =========================================================
           PONTOS DE FÔLEGO (AMARELO QUEIMADO / OCRE MARROM DA FICHA)
           Posicionado no canto superior esquerdo do busto (estilo Mael/Zuri)
           ========================================================= */
        #pe-container {
            position: absolute;
            top: 28px;
            left: 8px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transform: rotate(-6deg);
        }

        #pe-label {
            font: 700 8.5px/1 'Oswald', sans-serif;
            letter-spacing: 2.2px;
            color: var(--pe-core);
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: -4px;
            text-shadow:
                0 1px 2px #000,
                0 0 5px #000,
                0 0 8px var(--pe-glow);
        }

        #pe-val {
            font-family: 'Permanent Marker', 'Special Elite', cursive;
            font-size: 44px;
            line-height: 0.95;
            color: var(--pe-core);
            text-shadow:
                0 2px 0 #1a1105,
                0 3px 6px #000,
                0 0 8px var(--pe-mid),
                0 0 15px var(--pe-glow),
                0 0 24px var(--pe-bright),
                0 0 36px var(--pe-glow);
        }

        /* =========================================================
           BLOCO DIREITO: NOME + PV + LUCIDEZ + LOSANGOS (ESTILO MAEL)
           ========================================================= */
        #stats-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: -42px;
            margin-bottom: 12px;
            position: relative;
            z-index: 20;
        }

        #nome-val {
            font-family: 'Permanent Marker', 'Cinzel', serif;
            font-size: 40px;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f7f4ec;
            margin-bottom: 4px;
            transform: rotate(-1.5deg);
            pointer-events: none;
            text-shadow:
                0 2px 0 #000,
                0 4px 10px rgba(0, 0, 0, 0.98),
                0 0 14px rgba(255, 255, 255, 0.28),
                0 0 24px rgba(0, 0, 0, 0.9);
        }

        .stat-line {
            display: flex;
            align-items: baseline;
            font-family: 'Permanent Marker', 'Crimson Text', serif;
            line-height: 0.92;
            letter-spacing: 1px;
            pointer-events: none;
        }

        #vida-text {
            font-size: 40px;
            color: var(--hp-core);
            margin-left: 8px;
            transform: rotate(-1.5deg);
            text-shadow:
                0 2px 0 #2b0000,
                0 3px 6px #000,
                0 0 10px var(--hp-glow),
                0 0 20px var(--hp-glow),
                0 0 32px var(--hp-mid);
        }

        #san-text {
            font-size: 33px;
            color: var(--san-core);
            margin-left: 20px;
            margin-top: 2px;
            transform: rotate(-1.5deg);
            text-shadow:
                0 2px 0 #04122b,
                0 3px 6px #000,
                0 0 10px var(--san-glow),
                0 0 20px var(--san-glow),
                0 0 32px var(--san-mid);
        }

        .stat-slash {
            display: inline-block;
            margin: 0 3px;
            opacity: 0.92;
        }

        .stat-max {
            font-size: 0.92em;
        }

        /* =========================================================
           LOSANGOS DE MARCADORES DE CENA E GATILHOS (ESTILO MAEL)
           Suporta 1 (Vigilante), 3 (Mael) ou infinitos (Executor)
           ========================================================= */
        #gatilhos-container {
            display: none;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            max-width: 260px;
            margin-top: 10px;
            margin-left: 16px;
            min-height: 18px;
            pointer-events: auto;
        }

        .gatilho-losango {
            width: 11px;
            height: 11px;
            transform: rotate(45deg);
            /* Losango inativo: cinza translúcido facetado como os 2 da direita do Mael */
            background: rgba(180, 185, 195, 0.32);
            border: 1.6px solid rgba(235, 238, 245, 0.65);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), inset 0 0 3px rgba(255, 255, 255, 0.25);
            transition: all 0.22s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Losango Ativo: Vermelho Rubi Brilhante igual ao 1º losango do Mael */
        .gatilho-losango.ativo {
            background: #ff2424;
            border-color: #ffe0e0;
            box-shadow:
                0 0 6px #ff2424,
                0 0 14px #e60000,
                0 0 24px rgba(230, 0, 0, 0.95),
                inset 0 0 4px #fff;
        }

        /* Tags sutis de condições ativas */
        #alertas-obs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
            margin-left: 16px;
            pointer-events: none;
        }
        .alerta-tag-obs {
            font: 700 9px/1 'Oswald', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            background: rgba(158, 11, 15, 0.85);
            border: 1px solid rgba(255, 180, 180, 0.5);
            padding: 2px 6px;
            text-shadow: 0 1px 2px #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        @media (max-width: 700px) {
            #main-wrapper { padding: 14px 20px; }
            #character-stage { width: 210px; height: 294px; }
            #nome-val { font-size: 32px; }
            #vida-text { font-size: 34px; }
            #san-text { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div id="main-wrapper">
        <div id="character-stage">
            <div id="pe-container">
                <span id="pe-label">FÔL</span>
                <span id="pe-val">0</span>
            </div>
            <div id="image-frame">
                <img id="personagem-img" src="" alt="">
            </div>
        </div>

        <div id="stats-container">
            <div id="nome-val">...</div>
            <div id="vida-text" class="stat-line">0<span class="stat-slash">/</span><span class="stat-max">0</span></div>
            <div id="san-text" class="stat-line">0<span class="stat-slash">/</span><span class="stat-max">0</span></div>
            <!-- Losangos de Marcadores de Cena / Gatilhos (Estilo Mael) -->
            <div id="gatilhos-container" title="Clique para alternar marcador"></div>
            <div id="alertas-obs"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzOGimCx5mgObg1ulI0SdnbyS0zlU-DkI",
            authDomain: "fichasrpg-7fc69.firebaseapp.com",
            projectId: "fichasrpg-7fc69",
            storageBucket: "fichasrpg-7fc69.firebasestorage.app",
            messagingSenderId: "758802032764",
            appId: "1:758802032764:web:40467e15fdc24c570081f9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const id = new URLSearchParams(window.location.search).get('id');

        let globalHexatombe = false;
        let ultimoDoc = null;

        function aplicarEnquadramentoOBS(img, z, x, y) {
            if (!img || !img.parentElement) return;
            const box = img.parentElement;
            const nw = img.naturalWidth, nh = img.naturalHeight;
            const w = box.clientWidth, h = box.clientHeight;
            if (!nw || !nh || !w || !h) return;

            const zoom = parseFloat(z) || 1;
            const posX = isNaN(parseFloat(x)) ? 50 : parseFloat(x);
            const posY = isNaN(parseFloat(y)) ? 50 : parseFloat(y);

            const s = Math.max(w / nw, h / nh) * zoom;
            const iw = nw * s, ih = nh * s;

            img.style.objectFit = 'fill';
            img.style.maxWidth = 'none';
            img.style.maxHeight = 'none';
            img.style.transform = 'none';
            img.style.width = iw + 'px';
            img.style.height = ih + 'px';
            img.style.left = ((w - iw) * (posX / 100)) + 'px';
            img.style.top  = ((h - ih) * (posY / 100)) + 'px';
        }

        const imgElGlobal = document.getElementById('personagem-img');
        imgElGlobal.addEventListener('load', function() {
            aplicarEnquadramentoOBS(this, this.dataset.pz || 1, this.dataset.px ?? 50, this.dataset.py ?? 50);
        });

        db.collection("configuracoes").doc("globais").onSnapshot(doc => {
            if (doc.exists) {
                globalHexatombe = !!doc.data().hexatombe;
                if (ultimoDoc) renderizarPortraitOBS(ultimoDoc);
            }
        });

        // Permite clicar diretamente no losango no OBS/Navegador se desejar
        window.clicarLosangoOBS = function(indiceClicado) {
            if (!id || !ultimoDoc) return;
            const atualAtivos = Math.max(0, parseInt(ultimoDoc.gatilhosAtivos) || 0);
            const novoAtivos = (atualAtivos === indiceClicado) ? indiceClicado - 1 : indiceClicado;
            db.collection("fichas").doc(id).update({ gatilhosAtivos: Math.max(0, novoAtivos) });
        };

        function renderizarPortraitOBS(d_raw) {
            if (!d_raw) return;
            const hF = !!d_raw.hexatombe || globalHexatombe;
            const d = (hF && d_raw.hexatombe_data) ? { ...d_raw, ...d_raw.hexatombe_data } : d_raw;

            const vAt = hF ? (d_raw.hexatombe_data?.vidaAtual ?? d_raw.vidaAtual ?? 0) : (d_raw.vidaAtual ?? 0);
            const sAt = hF ? (d_raw.hexatombe_data?.sanAtual ?? d_raw.sanAtual ?? 0) : (d_raw.sanAtual ?? 0);
            const pAt = hF ? (d_raw.hexatombe_data?.peAtual ?? d_raw.peAtual ?? 0) : (d_raw.peAtual ?? 0);

            const vMx = d.vidaMax ?? 12;
            const sMx = d.sanMax ?? 50;

            const nomeCompleto = String(d.nome || "Persona").trim();
            document.getElementById('nome-val').innerText = nomeCompleto.split(/\s+/)[0] || "Persona";
            document.getElementById('pe-val').innerText = pAt;
            document.getElementById('vida-text').innerHTML = `${vAt}<span class="stat-slash">/</span><span class="stat-max">${vMx}</span>`;
            document.getElementById('san-text').innerHTML  = `${sAt}<span class="stat-slash">/</span><span class="stat-max">${sMx}</span>`;

            let estado = "Normal";
            document.body.className = "";
            if (vAt <= 0) {
                estado = "Morto";
                document.body.classList.add('estado-morto');
            } else if (sAt <= 0) {
                estado = "Enlouquecendo";
                document.body.classList.add('estado-choque');
            } else if ((vAt / Math.max(1, vMx)) <= 0.5) {
                estado = "Machucado";
                document.body.classList.add('estado-machucado');
            }

            const imgFinal = d["portrait" + estado] || d.portraitNormal || d.portrait || "";
            const zoom = (estado !== "Normal" && d["p" + estado + "Zoom"] !== undefined) ? d["p" + estado + "Zoom"] : (d.pZ ?? 1);
            const x = (estado !== "Normal" && d["p" + estado + "X"] !== undefined) ? d["p" + estado + "X"] : (d.pX ?? 50);
            const y = (estado !== "Normal" && d["p" + estado + "Y"] !== undefined) ? d["p" + estado + "Y"] : (d.pY ?? 50);

            imgElGlobal.dataset.pz = zoom;
            imgElGlobal.dataset.px = x;
            imgElGlobal.dataset.py = y;

            if (imgFinal && imgElGlobal.src !== imgFinal) {
                imgElGlobal.src = imgFinal;
            } else if (imgElGlobal.complete && imgElGlobal.naturalWidth) {
                aplicarEnquadramentoOBS(imgElGlobal, zoom, x, y);
            }

            // Losangos de Marcadores de Cena / Gatilhos (Vigilante = 1, Mael = 3, Executor = Infinito, 0 = Oculto)
            const gatCont = document.getElementById('gatilhos-container');
            const ativosGatilhos = Math.max(0, parseInt(d_raw.gatilhosAtivos ?? d.gatilhosAtivos) || 0);
            const maxGatilhos = Math.max(0, parseInt(d_raw.gatilhosMax ?? d.gatilhosMax) || 0);
            const totalExibido = Math.max(maxGatilhos, ativosGatilhos);

            if (totalExibido > 0) {
                let htmlLosangos = '';
                for (let i = 1; i <= totalExibido; i++) {
                    htmlLosangos += `<div class="gatilho-losango ${i <= ativosGatilhos ? 'ativo' : ''}" onclick="window.clicarLosangoOBS(${i})"></div>`;
                }
                gatCont.innerHTML = htmlLosangos;
                gatCont.style.display = 'flex';
            } else {
                gatCont.innerHTML = '';
                gatCont.style.display = 'none';
            }

            const alertasEl = document.getElementById('alertas-obs');
            const conds = Array.isArray(d.statusAcumulados) ? d.statusAcumulados.filter(c => c && c !== 'Normal') : [];
            alertasEl.innerHTML = conds.map(c => `<span class="alerta-tag-obs">${c}</span>`).join('');
        }

        if (id) {
            db.collection("fichas").doc(id).onSnapshot(doc => {
                if (!doc.exists) return;
                ultimoDoc = doc.data();
                renderizarPortraitOBS(ultimoDoc);
            });
        }
    </script>
</body>
</html>
