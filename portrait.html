<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portrait Transparente</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap');

        :root {
            --vida: #ff2a2a;
            --vida-claro: #ffd9d4;
            --san: #3d8bff;
            --san-claro: #d6e6ff;
            /* Fôlego: amarelo queimado / marrom, igual à ficha de persona */
            --folego: #b8863b;
            --folego-claro: #f3dfb4;
            --osso: #f1e9d6;
        }

        /* FORÇA TRANSPARÊNCIA TOTAL NO NAVEGADOR E NO OBS */
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            background: none !important;
            background-color: transparent !important;
        }

        #main-wrapper {
            display: flex; flex-direction: row; align-items: flex-end;
            padding: 20px; gap: 25px;
            box-sizing: border-box; width: 600px; height: 390px; /* tela fixa: 600 x 390 */
            background: transparent !important;
        }

        /* CAIXA DO PORTRAIT (Proporção 1 : 1.4) */
        #image-frame {
            position: relative;
            width: 250px;
            height: 350px;
            overflow: hidden;
            background: transparent !important;
            border: none;
        }

        #personagem-img {
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Mantém a proporção sem distorcer */
            background: transparent !important;
            transition: transform 0.3s ease-out, object-position 0.3s ease-out, filter 0.6s ease;
            /* drop-shadow não cria fundo preto, diferente de box-shadow */
            filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.8));
        }

        /* ---------- TEXTOS ---------- */
        #stats-container {
            display: flex; flex-direction: column; align-items: flex-start;
            margin-left: -58px; position: relative; z-index: 10; pointer-events: none;
            gap: 2px;
        }

        /* Nome: estilo "etiqueta de arquivo" com régua vermelha embaixo */
        #nome-val {
            display: inline-block;
            font-family: 'Oswald', 'Special Elite', sans-serif;
            font-weight: 700;
            font-size: 36px;
            line-height: 1.05;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--osso);
            text-shadow: 0 0 2px #000, 2px 2px 3px #000, 0 0 10px var(--vida), 0 0 18px rgba(255, 0, 0, .55);
            padding-bottom: 4px;
            margin-bottom: 4px;
            margin-left: -16px;
            position: relative;
        }
        #nome-val::after {
            content: ""; position: absolute; left: 0; bottom: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--vida) 0%, rgba(255, 42, 42, .55) 55%, transparent 100%);
            box-shadow: 0 0 6px rgba(255, 0, 0, .8);
        }

        /* Linhas de recurso: rótulo pequeno (datilografado) + valor grande */
        .recurso { display: flex; align-items: baseline; gap: 9px; }
        .recurso.vida { margin-left: 4px; }
        .recurso.san  { margin-left: 14px; }

        .valor {
            display: inline-block;
            font-family: 'Special Elite', 'Courier Prime', monospace;
            font-size: 42px;
            line-height: 1.05;
            color: #fff;
            letter-spacing: .02em;
        }
        .vida .valor { text-shadow: 0 0 2px #000, 2px 2px 2px #000, 0 0 8px var(--vida), 0 0 14px var(--vida); }
        .san  .valor { text-shadow: 0 0 2px #000, 2px 2px 2px #000, 0 0 8px var(--san),  0 0 14px var(--san); }

        /* Fôlego: canto do retrato, agora em marrom/amarelo queimado */
        #pe-container {
            position: absolute; bottom: 10px; left: 24px; z-index: 10;
            display: flex; align-items: baseline; gap: 6px;
        }
        #pe-val {
            display: inline-block;
            font-family: 'Special Elite', 'Courier Prime', monospace;
            font-size: 46px; line-height: 1;
            color: var(--folego-claro);
            text-shadow: 0 0 2px #000, 2px 2px 2px #000, 0 0 8px var(--folego), 0 0 14px var(--folego);
        }

        /* ---------- MARCADORES DE CENA & GATILHOS ---------- */
        #marcadores {
            display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
            margin: 6px 0 17px 12px;
        }
        #marcadores:empty { display: none; }

        .marcador { display: flex; align-items: center; gap: 8px; }
        .m-pips { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; max-width: 170px; }

        /* Losango: vazio = só contorno; cheio = osso com brilho vermelho */
        .pip {
            width: 11px; height: 11px;
            transform: rotate(45deg);
            border: 1.5px solid rgba(255, 42, 42, .85);
            background: rgba(0, 0, 0, .55);
            /* aro escuro + aro claro por fora: aparece em qualquer fundo */
            box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .9), 0 0 0 3px rgba(255, 240, 225, .75), 0 0 6px 3px rgba(0, 0, 0, .55);
            transition: background .25s, box-shadow .25s, border-color .25s;
        }
        .pip.on {
            background: var(--vida);
            border-color: #ff8a80;
            box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .9), 0 0 0 3px rgba(255, 240, 225, .9), 0 0 8px 3px rgba(255, 0, 0, .7);
        }

        /* Marcador pronto/ativo (cheio, ou com bônus acumulado) */
        .marcador.pronto .pip.on { animation: pulso 1.8s ease-in-out infinite; }

        /* Bônus acumulado (Executor etc.) */
        .m-bonus {
            font-family: 'Special Elite', monospace;
            font-size: 24px; line-height: 1;
            color: var(--folego-claro);
            text-shadow: 0 0 2px #000, 1px 1px 2px #000, 0 0 8px var(--folego);
        }

        /* ---------- ESTADOS ---------- */
        body[data-estado="machucado"] #vida-text { color: var(--vida-claro); animation: batida 1.6s ease-in-out infinite; }
        body[data-estado="enlouquecendo"] #san-text { color: var(--san-claro); animation: tremor .9s steps(2, end) infinite; }
        body[data-estado="morto"] #personagem-img { filter: grayscale(1) contrast(1.1) drop-shadow(0 0 8px rgba(120, 0, 0, .9)); }
        body[data-estado="morto"] #vida-text { color: #777; text-shadow: 0 0 2px #000, 2px 2px 2px #000; }

        /* Flash quando um valor muda */
        .flash { animation: flash .6s ease-out; }

        @keyframes pulso   { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
        @keyframes batida  { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
        @keyframes tremor  { 0% { transform: translateX(0); } 50% { transform: translateX(1px); } 100% { transform: translateX(-1px); } }
        @keyframes flash   { 0% { transform: scale(1.18); filter: brightness(1.8); } 100% { transform: scale(1); filter: brightness(1); } }

    </style>
</head>
<body>
    <div id="main-wrapper">
        <div id="image-frame">
            <img id="personagem-img" src="">
            <div id="pe-container"><span id="pe-val">0</span></div>
        </div>
        <div id="stats-container">
            <div id="nome-val">...</div>
            <div class="recurso vida"><span class="valor" id="vida-text">0/0</span></div>
            <div class="recurso san"><span class="valor" id="san-text">0/0</span></div>
            <div id="marcadores"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzOGimCx5mgObg1ulI0SdnbyS0zlU-DkI",
            authDomain: "fichasrpg-7fc69.firebaseapp.com",
            projectId: "fichasrpg-7fc69",
            storageBucket: "fichasrpg-7fc69.firebasestorage.app",
            messagingSenderId: "758802032764",
            appId: "1:758802032764:web:40467e15fdc24c570081f9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const id = new URLSearchParams(window.location.search).get('id');

        // ENQUADRAMENTO IDÊNTICO AO EDITOR DE RECORTE DA FICHA
        // O editor usa uma caixa de 130x165; aqui ela é ampliada até cobrir a moldura de 250x350
        // (corta só alguns pixels nas laterais, o topo e a base ficam exatamente como no editor).
        const EDIT_W = 130, EDIT_H = 165, FRAME_W = 250, FRAME_H = 350;
        let fotoParams = { z: 1, x: 50, y: 50 };
        function aplicarFoto() {
            const img = document.getElementById('personagem-img');
            const nw = img.naturalWidth, nh = img.naturalHeight;
            if (!nw || !nh) return;
            const zoom = parseFloat(fotoParams.z) || 1;
            const px = isNaN(parseFloat(fotoParams.x)) ? 50 : parseFloat(fotoParams.x);
            const py = isNaN(parseFloat(fotoParams.y)) ? 50 : parseFloat(fotoParams.y);

            const k = Math.max(FRAME_W / EDIT_W, FRAME_H / EDIT_H);
            const vw = EDIT_W * k, vh = EDIT_H * k;
            const ox = (FRAME_W - vw) / 2, oy = (FRAME_H - vh) / 2;

            const s = Math.max(vw / nw, vh / nh) * zoom;
            const iw = nw * s, ih = nh * s;

            img.style.objectFit = 'fill';
            img.style.maxWidth = 'none';
            img.style.transform = 'none';
            img.style.width = iw + 'px';
            img.style.height = ih + 'px';
            img.style.left = (ox + (vw - iw) * (px / 100)) + 'px';
            img.style.top  = (oy + (vh - ih) * (py / 100)) + 'px';
        }
        document.getElementById('personagem-img').addEventListener('load', aplicarFoto);

        // Atualiza um texto e dá um "piscar" só quando o valor realmente mudou
        const primeiraCarga = {};
        function setTexto(elId, texto) {
            const el = document.getElementById(elId);
            if (el.innerText === texto) return;
            el.innerText = texto;
            if (primeiraCarga[elId]) {
                el.classList.remove('flash');
                void el.offsetWidth; // reinicia a animação
                el.classList.add('flash');
            }
            primeiraCarga[elId] = true;
        }

        // MARCADORES DE CENA & GATILHOS (campo "rastreadoresCena" da ficha)
        // - Sem limite de quantidade de marcadores nem de losangos (Vigilante = 1, Executor = ciclo + bônus acumulado)
        let assinaturaMarcadores = "";
        function renderMarcadores(lista) {
            const itens = Array.isArray(lista) ? lista : [];
            const assinatura = JSON.stringify(itens.map(r => [r.id, r.nome, r.atual, r.max, r.acumulado, r.acumulativo]));
            if (assinatura === assinaturaMarcadores) return;
            assinaturaMarcadores = assinatura;

            const cont = document.getElementById('marcadores');
            cont.replaceChildren();

            itens.forEach(r => {
                const nome = String(r.nome || "").trim();
                const max = Math.max(1, Math.min(12, parseInt(r.max) || 1));
                const atual = Math.max(0, Math.min(max, parseInt(r.atual) || 0));
                const acumulado = parseInt(r.acumulado) || 0;
                const empilhavel = r.acumulativo !== false && (r.acumulativo === true || /executor/i.test(nome));
                const pronto = empilhavel ? acumulado > 0 : atual >= max;

                const box = document.createElement('div');
                box.className = 'marcador' + (pronto ? ' pronto' : '');

                const pips = document.createElement('div');
                pips.className = 'm-pips';
                for (let i = 1; i <= max; i++) {
                    const p = document.createElement('span');
                    p.className = 'pip' + (i <= atual ? ' on' : '');
                    pips.appendChild(p);
                }
                box.appendChild(pips);

                if (empilhavel && acumulado > 0) {
                    const b = document.createElement('span');
                    b.className = 'm-bonus';
                    b.textContent = '+' + acumulado;
                    box.appendChild(b);
                }
                cont.appendChild(box);
            });
        }

        if (id) {
            db.collection("fichas").doc(id).onSnapshot(doc => {
                const d = doc.data();
                if (!d) return;

                const nomeCompleto = String(d.nome || "Persona").trim();
                setTexto('nome-val', nomeCompleto.split(/\s+/)[0] || "Persona");
                setTexto('pe-val', String(d.peAtual || 0));
                setTexto('vida-text', `${d.vidaAtual}/${d.vidaMax}`);
                setTexto('san-text', `${d.sanAtual}/${d.sanMax}`);

                renderMarcadores(d.rastreadoresCena);

                let estado = "Normal";
                if (d.vidaAtual <= 0) estado = "Morto";
                else if (d.sanAtual <= 0) estado = "Enlouquecendo";
                else if ((d.vidaAtual / d.vidaMax) <= 0.5) estado = "Machucado";
                document.body.dataset.estado = estado.toLowerCase();

                const imgFinal = d["portrait" + estado] || d.portraitNormal || d.portrait;
                const imgEl = document.getElementById('personagem-img');

                if (imgFinal && imgEl.src !== imgFinal) {
                    imgEl.src = imgFinal;
                }

                // VALORES SALVOS NA FICHA
                const zoom = d["p" + estado + "Zoom"] || d.pZ || 1;
                const x = d["p" + estado + "X"] !== undefined ? d["p" + estado + "X"] : 50;
                const y = d["p" + estado + "Y"] !== undefined ? d["p" + estado + "Y"] : 50;

                // APLICANDO O ENQUADRAMENTO (mesma matemática do editor de recorte da ficha)
                fotoParams = { z: zoom, x: x, y: y };
                aplicarFoto();
            });
        }
    </script>
</body>
</html>
