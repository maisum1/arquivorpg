<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>A.R.Q.U.I.V.O. - Portrait OBS</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Text:ital,wght@0,700;1,700&family=Oswald:wght@600;700&family=Special+Elite&display=swap');

        /* Transparência absoluta para Browser Source no OBS */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: none !important;
            background-color: transparent !important;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --hp-glow: #c9181e;
            --hp-core: #ffdad9;
            --san-glow: #1c52a6;
            --san-core: #dbeaff;
            /* Cor do Fôlego: Amarelo Queimado / Ocre Marrom da Ficha */
            --pe-glow: #8f5d1e;
            --pe-mid: #c88732;
            --pe-core: #fae6c3;
            --ink-shadow: #050505;
        }

        #main-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: row;
            align-items: flex-end;
            padding: 26px 38px 26px 28px;
            background: transparent !important;
        }

        /* =========================================================
           MOLDURA ORGÂNICA DO PERSONAGEM + NÉVOA DE BASE (ESTILO MAEL)
           ========================================================= */
        #image-frame {
            position: relative;
            width: 245px;
            height: 335px;
            overflow: hidden;
            background: transparent !important;
            flex-shrink: 0;
            /* Fade suave na borda inferior para não ficar um corte reto seco na stream */
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 80%, rgba(0,0,0,0.4) 93%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 80%, rgba(0,0,0,0.4) 93%, transparent 100%);
        }

        #personagem-img {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            background: transparent !important;
            transition: width 0.25s ease, height 0.25s ease, left 0.25s ease, top 0.25s ease, filter 0.45s ease;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 10px rgba(158, 11, 15, 0.45));
        }

        /* Estados visuais reativos da imagem no OBS */
        body.estado-machucado #personagem-img {
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(210, 15, 22, 0.95)) contrast(1.06);
            animation: pulseBloodOBS 2.4s infinite ease-in-out;
        }
        body.estado-choque #personagem-img {
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(38, 102, 210, 0.9)) saturate(0.65) contrast(1.12);
        }
        body.estado-morto #personagem-img {
            filter: grayscale(100%) contrast(1.25) brightness(0.65) drop-shadow(0 4px 16px #000);
        }

        @keyframes pulseBloodOBS {
            0%, 100% { filter: drop-shadow(0 4px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 12px rgba(200,15,20,0.75)); }
            50%      { filter: drop-shadow(0 4px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 24px rgba(255,25,30,1)); }
        }

        /* =========================================================
           PONTOS DE FÔLEGO (OCRE / AMARELO QUEIMADO - CANTO ESQUERDO)
           ========================================================= */
        #pe-container {
            position: absolute;
            bottom: 34px;
            left: 16px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transform: rotate(-3deg);
        }

        #pe-label {
            font: 700 9px/1 'Oswald', sans-serif;
            letter-spacing: 2px;
            color: var(--pe-core);
            text-transform: uppercase;
            opacity: 0.88;
            margin-bottom: -3px;
            text-shadow: 0 1px 3px #000, 0 0 6px var(--pe-glow);
        }

        #pe-val {
            font: 700 44px/0.95 'Cinzel', 'Crimson Text', serif;
            color: var(--pe-core);
            text-shadow:
                0 2px 4px #000,
                0 0 6px #000,
                0 0 12px var(--pe-mid),
                0 0 22px var(--pe-glow),
                0 0 32px var(--pe-glow);
        }

        /* =========================================================
           BLOCO DIREITO: NOME + PV + LUCIDEZ + LOSANGOS DE GATILHO
           ========================================================= */
        #stats-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: -38px;
            margin-bottom: 14px;
            position: relative;
            z-index: 20;
            pointer-events: none;
        }

        #nome-val {
            font: 900 38px/0.92 'Cinzel', 'Crimson Text', serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #f7f4ec;
            margin-bottom: 4px;
            text-shadow:
                0 2px 0 #000,
                0 3px 8px rgba(0, 0, 0, 0.95),
                0 0 14px rgba(169, 25, 30, 0.75),
                0 0 26px rgba(169, 25, 30, 0.45);
        }

        .stat-line {
            display: flex;
            align-items: baseline;
            font-family: 'Crimson Text', Georgia, serif;
            font-weight: 700;
            font-style: italic;
            line-height: 0.96;
            letter-spacing: 0.5px;
        }

        #vida-text {
            font-size: 40px;
            color: var(--hp-core);
            margin-left: 10px;
            text-shadow:
                0 2px 3px #000,
                0 0 7px #000,
                0 0 12px var(--hp-glow),
                0 0 22px var(--hp-glow),
                0 0 34px rgba(201, 24, 30, 0.85);
        }

        #san-text {
            font-size: 35px;
            color: var(--san-core);
            margin-left: 24px;
            margin-top: 1px;
            text-shadow:
                0 2px 3px #000,
                0 0 7px #000,
                0 0 12px var(--san-glow),
                0 0 22px var(--san-glow),
                0 0 34px rgba(28, 82, 166, 0.85);
        }

        .stat-slash {
            display: inline-block;
            margin: 0 3px;
            font-weight: 700;
            transform: skewX(-14deg) scaleY(1.08);
            opacity: 0.92;
        }

        .stat-max {
            font-size: 0.86em;
            opacity: 0.94;
        }

        /* =========================================================
           LOSANGOS DE MARCADORES DE CENA E GATILHOS (ESTILO MAEL)
           ========================================================= */
        #gatilhos-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 9px;
            margin-left: 20px;
            min-height: 16px;
        }

        .gatilho-losango {
            width: 11px;
            height: 11px;
            transform: rotate(45deg);
            background: rgba(18, 18, 18, 0.75);
            border: 1.8px solid rgba(235, 228, 212, 0.55);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
            transition: all 0.25s ease;
        }

        /* Losango Ativo: Brilho Vermelho Intenso igual à foto do Mael */
        .gatilho-losango.ativo {
            background: #ff2a2a;
            border-color: #ffd2d2;
            box-shadow:
                0 0 6px #ff1a1a,
                0 0 12px #d90b0f,
                0 0 20px rgba(217, 11, 15, 0.95);
        }

        /* Marcadores extras de Estado Crítico (Óbito / Choque / Condição) se ativos */
        #alertas-obs {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
            margin-left: 20px;
        }
        .alerta-tag-obs {
            font: 700 9px/1 'Oswald', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            background: rgba(158, 11, 15, 0.85);
            border: 1px solid rgba(255, 180, 180, 0.5);
            padding: 2px 6px;
            text-shadow: 0 1px 2px #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="main-wrapper">
        <div id="image-frame">
            <img id="personagem-img" src="" alt="">
        </div>

        <div id="pe-container">
            <span id="pe-label">FÔL</span>
            <span id="pe-val">0</span>
        </div>

        <div id="stats-container">
            <div id="nome-val">...</div>
            <div id="vida-text" class="stat-line">0<span class="stat-slash">/</span><span class="stat-max">0</span></div>
            <div id="san-text" class="stat-line">0<span class="stat-slash">/</span><span class="stat-max">0</span></div>
            <!-- Losangos de Marcadores de Cena / Gatilhos (embaixo da vida/lucidez, igual ao Mael) -->
            <div id="gatilhos-container"></div>
            <div id="alertas-obs"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzOGimCx5mgObg1ulI0SdnbyS0zlU-DkI",
            authDomain: "fichasrpg-7fc69.firebaseapp.com",
            projectId: "fichasrpg-7fc69",
            storageBucket: "fichasrpg-7fc69.firebasestorage.app",
            messagingSenderId: "758802032764",
            appId: "1:758802032764:web:40467e15fdc24c570081f9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const id = new URLSearchParams(window.location.search).get('id');

        let globalHexatombe = false;
        let ultimoDoc = null;

        // Mesma matemática de enquadramento da ficha e do Hub (não corta cabeças nem pés no zoom)
        function aplicarEnquadramentoOBS(img, z, x, y) {
            if (!img || !img.parentElement) return;
            const box = img.parentElement;
            const nw = img.naturalWidth, nh = img.naturalHeight;
            const w = box.clientWidth, h = box.clientHeight;
            if (!nw || !nh || !w || !h) return;

            const zoom = parseFloat(z) || 1;
            const posX = isNaN(parseFloat(x)) ? 50 : parseFloat(x);
            const posY = isNaN(parseFloat(y)) ? 50 : parseFloat(y);

            const s = Math.max(w / nw, h / nh) * zoom;
            const iw = nw * s, ih = nh * s;

            img.style.objectFit = 'fill';
            img.style.maxWidth = 'none';
            img.style.maxHeight = 'none';
            img.style.transform = 'none';
            img.style.width = iw + 'px';
            img.style.height = ih + 'px';
            img.style.left = ((w - iw) * (posX / 100)) + 'px';
            img.style.top  = ((h - ih) * (posY / 100)) + 'px';
        }

        const imgElGlobal = document.getElementById('personagem-img');
        imgElGlobal.addEventListener('load', function() {
            aplicarEnquadramentoOBS(this, this.dataset.pz || 1, this.dataset.px ?? 50, this.dataset.py ?? 50);
        });

        db.collection("configuracoes").doc("globais").onSnapshot(doc => {
            if (doc.exists) {
                globalHexatombe = !!doc.data().hexatombe;
                if (ultimoDoc) renderizarPortraitOBS(ultimoDoc);
            }
        });

        function renderizarPortraitOBS(d_raw) {
            if (!d_raw) return;
            const hF = !!d_raw.hexatombe || globalHexatombe;
            const d = (hF && d_raw.hexatombe_data) ? { ...d_raw, ...d_raw.hexatombe_data } : d_raw;

            const vAt = hF ? (d_raw.hexatombe_data?.vidaAtual ?? d_raw.vidaAtual ?? 0) : (d_raw.vidaAtual ?? 0);
            const sAt = hF ? (d_raw.hexatombe_data?.sanAtual ?? d_raw.sanAtual ?? 0) : (d_raw.sanAtual ?? 0);
            const pAt = hF ? (d_raw.hexatombe_data?.peAtual ?? d_raw.peAtual ?? 0) : (d_raw.peAtual ?? 0);

            const vMx = d.vidaMax ?? 12;
            const sMx = d.sanMax ?? 50;

            const nomeCompleto = String(d.nome || "Persona").trim();
            document.getElementById('nome-val').innerText = nomeCompleto.split(/\s+/)[0] || "Persona";
            document.getElementById('pe-val').innerText = pAt;
            document.getElementById('vida-text').innerHTML = `${vAt}<span class="stat-slash">/</span><span class="stat-max">${vMx}</span>`;
            document.getElementById('san-text').innerHTML  = `${sAt}<span class="stat-slash">/</span><span class="stat-max">${sMx}</span>`;

            // Estado fisiológico / mental para trocar foto e aura
            let estado = "Normal";
            document.body.className = "";
            if (vAt <= 0) {
                estado = "Morto";
                document.body.classList.add('estado-morto');
            } else if (sAt <= 0) {
                estado = "Enlouquecendo";
                document.body.classList.add('estado-choque');
            } else if ((vAt / Math.max(1, vMx)) <= 0.5) {
                estado = "Machucado";
                document.body.classList.add('estado-machucado');
            }

            const imgFinal = d["portrait" + estado] || d.portraitNormal || d.portrait || "";
            const zoom = (estado !== "Normal" && d["p" + estado + "Zoom"] !== undefined) ? d["p" + estado + "Zoom"] : (d.pZ ?? 1);
            const x = (estado !== "Normal" && d["p" + estado + "X"] !== undefined) ? d["p" + estado + "X"] : (d.pX ?? 50);
            const y = (estado !== "Normal" && d["p" + estado + "Y"] !== undefined) ? d["p" + estado + "Y"] : (d.pY ?? 50);

            imgElGlobal.dataset.pz = zoom;
            imgElGlobal.dataset.px = x;
            imgElGlobal.dataset.py = y;

            if (imgFinal && imgElGlobal.src !== imgFinal) {
                imgElGlobal.src = imgFinal;
            } else if (imgElGlobal.complete && imgElGlobal.naturalWidth) {
                aplicarEnquadramentoOBS(imgElGlobal, zoom, x, y);
            }

            // Renderiza os Losangos de Marcadores de Cena e Gatilhos (Estilo Mael)
            const gatCont = document.getElementById('gatilhos-container');
            const totalGatilhos = Math.max(0, Math.min(10, parseInt(d_raw.gatilhosMax ?? d.gatilhosMax) || 0));
            const ativosGatilhos = Math.max(0, parseInt(d_raw.gatilhosAtivos ?? d.gatilhosAtivos) || 0);

            if (totalGatilhos > 0) {
                let htmlLosangos = '';
                for (let i = 1; i <= totalGatilhos; i++) {
                    htmlLosangos += `<div class="gatilho-losango ${i <= ativosGatilhos ? 'ativo' : ''}"></div>`;
                }
                gatCont.innerHTML = htmlLosangos;
                gatCont.style.display = 'flex';
            } else {
                gatCont.innerHTML = '';
                gatCont.style.display = 'none';
            }

            // Exibe tags sutis se tiver condições clínicas ativas (Sangrando, Atordoado, etc.)
            const alertasEl = document.getElementById('alertas-obs');
            const conds = Array.isArray(d.statusAcumulados) ? d.statusAcumulados.filter(c => c && c !== 'Normal') : [];
            alertasEl.innerHTML = conds.map(c => `<span class="alerta-tag-obs">${c}</span>`).join('');
        }

        if (id) {
            db.collection("fichas").doc(id).onSnapshot(doc => {
                if (!doc.exists) return;
                ultimoDoc = doc.data();
                renderizarPortraitOBS(ultimoDoc);
            });
        }
    </script>
</body>
</html>
