<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Campanha</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17202b;--dk:#17202b;--in:#141c26;--dot:#2c3b4e;--pn:#202c3a;--ln:#33445a;--tx:#e6e9ee;--mu:#93a1b3;--ac:#e0a84a}
:root[data-tema=rosa]{--bg:#2b1824;--dk:#2b1824;--in:#22121b;--dot:#4a2b3c;--pn:#3b2231;--ln:#6a4258;--tx:#fdeef5;--mu:#d9a9c0;--ac:#f58ab8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.4 'Alegreya Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;overflow:hidden;overscroll-behavior:none;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--ac);color:var(--dk);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{background:var(--in);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:100%}
#side{width:210px;background:var(--pn);border-right:1px solid var(--ln);padding:12px;display:flex;flex-direction:column;gap:8px;flex:none;overflow:auto}
h1{font:700 20px 'Alegreya',serif;margin:0 0 4px}
.proj{display:flex;gap:4px}.proj button:first-child{flex:1;text-align:left}
#main{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;overflow:hidden;cursor:default;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:24px 24px;touch-action:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#svg,#svgTop{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#svgTop{z-index:2}
#svg g,#svgTop g{pointer-events:auto;cursor:pointer}
.node{position:absolute;width:var(--w,190px);background:var(--pn);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:8px;padding:8px 10px;cursor:move;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.node.has{box-shadow:5px 5px 0 -1px var(--pn),5px 5px 0 0 var(--ln)}
.node.sel{box-shadow:0 0 0 2px var(--ac)}.node.has.sel{box-shadow:0 0 0 2px var(--ac),5px 5px 0 0 var(--ln)}
.node.src{box-shadow:0 0 0 2px #fff}
.node small{color:var(--c);font-weight:700}
.node b{display:block;font-size:16px}
.node p{margin:4px 0 0;color:var(--mu);font-size:13px;max-height:74px;overflow:hidden;white-space:pre-wrap}
.node img{width:100%;border-radius:4px;margin-top:6px;display:block;pointer-events:none}
.kids{margin-top:6px;font-size:12px;font-weight:700;color:var(--ac)}
#tools{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:4}
#tools>*{pointer-events:auto}
#tools button{background:color-mix(in srgb,var(--pn) 94%,transparent)}
#tools button.on{background:var(--ac);color:var(--dk);border-color:var(--ac)}
#menu,#scrim,#pclose{display:none}
#crumbs{flex-basis:100%;display:none;gap:4px;overflow-x:auto;white-space:nowrap;padding-bottom:2px}
#crumbs button{padding:4px 10px;flex:none}
#panel{position:absolute;top:calc(var(--th,44px) + 20px);right:10px;width:290px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px;display:none;flex-direction:column;gap:6px;max-height:calc(100% - var(--th,44px) - 110px);overflow:auto;z-index:5}
#panel.show{display:flex}
#panel>*{flex:none}
#ptext{min-height:90px}
#bar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px;align-items:flex-end}
#bar textarea{resize:none;height:44px;flex:1}
#msg{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);border-radius:8px;padding:6px 12px;display:none;max-width:90%;z-index:9}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:10px;width:min(420px,92vw)}
dialog::backdrop{background:#0008}
label{display:block;color:var(--mu);font-size:13px;margin-top:6px}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--mu);text-align:center;padding:20px}
#tlp{position:absolute;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.tlh{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--ln)}
.tlh h1{flex:1;margin:0}
#tll{flex:1;overflow:auto;padding:18px 16px 60px 28px;max-width:780px;width:100%;margin:0 auto}
.tli{position:relative;padding:0 0 22px 22px;border-left:2px solid var(--ln)}
.tli::before{content:'';position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:#c58ad9;border:2px solid var(--bg)}
.tlw{width:min(260px,100%);font-size:13px;padding:2px 8px;margin-bottom:4px;color:#c58ad9;background:transparent;border-style:dashed}
.tli b{display:block;font-size:17px}
.tli p{margin:2px 0 4px;color:var(--mu);font-size:14px}
.tli small{color:var(--mu)}
.tla{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tlempty{color:var(--mu);text-align:center;padding:40px 10px}
.tlh{flex-wrap:wrap}
.tlh input{flex:1;min-width:0}
#srp{position:absolute;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#srl{flex:1;overflow:auto;padding:10px 12px 60px;max-width:780px;width:100%;margin:0 auto}
.sri{display:block;width:100%;text-align:left;margin-bottom:6px;padding:10px}
.sri b{display:block;font-size:16px}
.sri .c1{font-size:12px;font-weight:700;color:var(--c,var(--mu))}
.sri small{display:block;color:var(--mu)}
.sri p{margin:3px 0 0;color:var(--mu);font-size:13px}
mark{background:#e0a84a66;color:inherit;border-radius:3px;padding:0 1px}
#bar{flex-wrap:wrap}
#bar textarea{min-width:0}
#atts{display:none;flex-basis:100%;gap:6px;overflow-x:auto;padding-bottom:2px}
.att{display:flex;align-items:center;gap:6px;background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:3px 4px 3px 6px;flex:none;max-width:220px}
.att img{width:30px;height:30px;object-fit:cover;border-radius:4px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.att button{min-height:0;padding:0 6px;border:none;background:transparent}
#bgimg{z-index:-2;position:absolute;left:0;top:0;pointer-events:none;opacity:.42;user-select:none;max-width:none}
.node.dim{opacity:.25}
.node .ses{font-size:11px;color:var(--mu);margin-top:4px}
#sesp{position:absolute;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#sestabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--ln)}
#sestabs button{flex:none}
#sesbody{flex:1;overflow:auto;padding:14px 16px 80px;max-width:820px;width:100%;margin:0 auto}
#sesbody h2{font-size:16px;margin:16px 0 8px;color:var(--mu)}
.sesrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.scn{border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:8px;background:var(--pn);padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.scnh{display:flex;gap:8px;align-items:center}
.scn .chip{font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
.scn small{color:var(--mu)}
.scn label{margin-top:2px}
#pklist{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:6px 0}
#pklist button{text-align:left}
#tools button.on{background:var(--ac)}
@media(max-width:700px){
 #tools button{padding:8px 8px;min-width:40px}
 input,select,textarea{font-size:16px}
 button{min-height:42px;padding:8px 12px}
 #side{position:fixed;left:0;top:0;bottom:0;width:min(290px,84vw);z-index:30;transform:translateX(-102%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
 body.menu #side{transform:none}
 #scrim{position:fixed;inset:0;background:#0007;z-index:25}
 body.menu #scrim{display:block}
 #menu{display:inline-block}
 .t{display:none}
 #crumbs button{min-height:36px}
 #panel{top:calc(var(--th,44px) + 18px + env(safe-area-inset-top));left:8px;right:8px;width:auto;max-height:40dvh}
 #ptext{height:80px;min-height:80px}
 #pclose{display:block}
 #bar{left:8px;right:8px}
 #bar textarea{height:52px}
 #msg{bottom:calc(92px + env(safe-area-inset-bottom))}
 .node p{font-size:14px}
 dialog{max-height:90dvh;overflow:auto}
}

.node.t-lugar{background:linear-gradient(180deg,#7fc29b2e,var(--pn) 65%);border-color:#7fc29b;border-width:2px;border-top-width:5px}
.node.t-lugar b{font-family:'Alegreya',serif;font-size:19px}
.node.t-personagem b{padding-right:40px}
.av{position:absolute;right:8px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--dk);font:700 17px 'Alegreya',serif;display:grid;place-items:center}
.node.t-pista{background:linear-gradient(#e0a84a22,#e0a84a12);border-color:#e0a84a88}
.node.t-evento{background:#c58ad914;border-style:dashed;border-top-style:solid;border-color:#c58ad9aa}
.node.t-nota{background:var(--in);border-style:dashed;border-top-width:2px;opacity:.93}
.when{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;background:var(--c);color:var(--dk);border-radius:10px;padding:0 8px;vertical-align:1px}
.node.s0 .av{display:none}.node.s0{--w:130px;padding:5px 7px;font-size:12px}.node.s0 b{font-size:13px}.node.s0 p,.node.s0 .kids{display:none}
.node.s1{--w:160px;padding:6px 8px;font-size:13px}.node.s1 b{font-size:14px}.node.s1 p{font-size:12px;max-height:48px}
.node.s3{--w:360px;border-top-width:7px;padding:14px 16px}.node.s3 b{font-size:25px}.node.s3 p{font-size:16px;max-height:150px}.node.s3 .av{width:44px;height:44px;font-size:22px}
.node.s4{--w:500px;border-top-width:9px;padding:18px 20px}.node.s4 b{font-size:32px}.node.s4 p{font-size:18px;max-height:220px}.node.s4 .av{width:54px;height:54px;font-size:28px}
.node.imgnode{z-index:-1;background:none;border:0;padding:0;border-radius:6px}
.node.imgnode img{margin:0;border-radius:6px}
.node.imgnode.sel{box-shadow:0 0 0 2px var(--ac)}
.rz{display:none;position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;background:var(--ac);border:2px solid var(--bg);border-radius:50%;cursor:nwse-resize;touch-action:none}
.node.sel .rz{display:block}

.node.msel{box-shadow:0 0 0 2px var(--ac)}
.mn{display:none;position:absolute;right:-14px;top:-14px;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--dk);font:700 18px/28px sans-serif;text-align:center;cursor:pointer;z-index:3;box-shadow:0 2px 6px #0008}
body.touch .node.sel .mn{display:block}
#mq{position:absolute;display:none;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent);pointer-events:none;z-index:6}
#nmenu{position:fixed;z-index:60;display:none;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px;min-width:200px;box-shadow:0 8px 24px #000a}
#nmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px 12px;border-radius:6px;font:inherit;font-size:15px;cursor:pointer}
#nmenu button:hover{background:var(--ln)}

.lb{position:absolute;left:-10px;top:-10px;width:26px;height:26px;display:grid;place-items:center;font-size:14px;background:var(--pn);border:1px solid var(--ac);border-radius:50%;cursor:pointer;z-index:3}
#libdlg{width:min(980px,96vw);height:min(88vh,740px);padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px}
#libdlg::backdrop{background:#000b}
#libdlg .lw{display:flex;flex-direction:column;height:100%}
#libdlg .lh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
#libdlg .lh b{flex:none}#libdlg .lh input{flex:1;min-width:140px}
#libdlg input,#libdlg textarea{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;width:100%}
#libdlg .lh input{width:auto}
#libdlg textarea{resize:vertical;min-height:220px}
#libdlg .lchips{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
#libdlg .lchips .on{background:var(--ac);color:var(--dk)}
#libdlg .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;overflow:auto;padding:4px 12px 14px;align-content:start;flex:1}
#libdlg .lc{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
#libdlg .lc:hover{border-color:var(--ac)}
#libdlg .lc .li{font-size:26px}#libdlg .lc small{color:var(--mu)}#libdlg .lc p{margin:0;font-size:12px;color:var(--mu);overflow:hidden;max-height:50px}#libdlg .lc em{font-size:12px;color:var(--ac);font-style:normal}
#libdlg .ld{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1}
#libdlg .lbt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#libdlg .lpv{width:100%;max-height:52vh;min-height:300px;object-fit:contain;background:var(--bg);border-radius:8px}
#libdlg .le{color:var(--mu);padding:12px}

.node.secret::before,.node.revealed::before{content:'🔒';position:absolute;left:8px;top:-13px;font-size:14px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:0 5px}
.node.revealed::before{content:'👁'}
body.pj .node.secret{background:var(--ln);border-style:dashed}
body.pj .node.secret>*{visibility:hidden}
body.pj .node.secret::before{display:none}
body.pj .node.secret::after{content:'🔒 desconhecido';position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-size:14px}
#pjbtn.on{background:var(--ac);color:var(--dk)}
#pment{font-size:13px;color:var(--mu);margin-top:8px}#pment b{display:block;margin:8px 0 2px}#pment button{margin:2px 4px 2px 0;padding:2px 8px;font-size:12px}
#libdlg .lc{position:relative}#libdlg .lsel{position:absolute;right:8px;top:8px;width:18px;height:18px}
#libdlg .lbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--ln)}#libdlg .lbar:empty{display:none}#libdlg .lbar select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;max-width:220px}
#libdlg .lsum{padding:0 12px 6px;color:var(--mu);font-size:12px}

.node.locked{outline:1px dotted var(--mu);outline-offset:3px;cursor:default}

.node.grouped{outline:2px dashed color-mix(in srgb,var(--ac) 65%,transparent);outline-offset:4px}

.go{position:absolute;right:10px;bottom:-12px;background:var(--ac);color:var(--dk);font:700 12px sans-serif;padding:4px 11px;border-radius:14px;cursor:pointer;z-index:3;box-shadow:0 2px 6px #0008;white-space:nowrap}
.go:hover{filter:brightness(1.12)}

#gbox{position:absolute;border:1px dashed var(--ac);pointer-events:none;z-index:4;border-radius:6px}
#gbox .gh{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--ac);border:2px solid var(--bg);cursor:nwse-resize;pointer-events:auto;touch-action:none}

.aibar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln)}.aibar input{flex:1;min-width:0;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit}

#panel>div:not(#pment){display:flex;flex-direction:column;gap:6px}
.tli{border-left:4px solid var(--sc,var(--ln))}.tli::before{background:var(--sc,#c58ad9)}
.tls{margin:20px 0 12px -10px;padding:6px 12px;border-radius:8px;border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 20%,transparent);font-weight:700;color:var(--tx)}
.tlsel{max-width:240px;background:var(--in);color:var(--tx);border:1px solid var(--sc,var(--ln));border-radius:8px;padding:4px 6px;font:inherit;font-size:13px}
#cmddlg{width:min(560px,94vw);padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px}#cmddlg::backdrop{background:#000b}

#cmddlg .ld{padding:12px;display:flex;flex-direction:column;gap:10px}#cmddlg input{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;width:100%}
#cmddlg .lchips{display:flex;gap:6px;flex-wrap:wrap}#cmddlg small{color:var(--mu)}

.tli.ok b::before{content:'✔ ';color:#7fc29b}.tli.no{opacity:.55}.tli.no b{text-decoration:line-through}

.tlbt{font-size:12px;font-weight:700;color:var(--bc);margin-bottom:2px}

#logdlg .ld{padding:12px;display:flex;flex-direction:column;gap:8px}#logdlg textarea{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;width:100%;resize:vertical}#logdlg small{color:var(--mu)}

.tst{display:inline-block;margin:2px 0 4px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ac) 22%,transparent);border:1px solid var(--ac);border-radius:10px;padding:1px 8px}
.oi{position:absolute;left:10px;bottom:-12px;background:var(--pn);color:var(--tx);border:1px solid var(--ac);font:700 12px sans-serif;padding:4px 10px;border-radius:14px;cursor:pointer;z-index:3;white-space:nowrap}
.node.flash{animation:fl 1.1s ease-out 3}@keyframes fl{0%{box-shadow:0 0 0 5px var(--ac),0 0 28px var(--ac)}100%{box-shadow:0 0 0 0 transparent}}
.flow{position:relative;padding:20px}.flow svg{position:absolute;left:0;top:0;pointer-events:none;color:#93a1b3}
.fb{position:absolute;width:190px;height:86px;background:var(--pn);border:1px solid var(--ln);border-top:5px solid var(--sc,var(--ln));border-radius:10px;padding:6px 9px;cursor:pointer;overflow:hidden;box-sizing:border-box}
.fb small{color:var(--mu);font-size:11px;display:block}.fb b{font-size:14px;line-height:1.2;display:block;max-height:46px;overflow:hidden}.fb.br{border-style:dashed;border-color:var(--bc)}.fb.no{opacity:.5}.fb.ok::after{content:'✔';position:absolute;right:8px;top:6px;color:#7fc29b}

#histdlg .lh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}

.node.t-lugar{background:linear-gradient(180deg,color-mix(in srgb,#7fc29b 22%,var(--pn)),var(--pn) 65%)}
.node.t-pista{background:linear-gradient(color-mix(in srgb,#e0a84a 18%,var(--pn)),color-mix(in srgb,#e0a84a 8%,var(--pn)));border-color:#e0a84acc}
.node.t-evento{background:color-mix(in srgb,#c58ad9 12%,var(--pn));border-color:#c58ad9cc}
.node.t-nota{background:var(--in);opacity:1}
.node.t-personagem,.node{background-color:var(--pn)}
.tstw{margin:2px 0 4px}.dtl{font-size:12.5px;margin:2px 0;line-height:1.3}.dtl b{color:var(--ac)}.node.s0 .dtl{display:none}
.node.t-texto{background:none!important;border:0!important;box-shadow:none;padding:4px 8px;--w:max-content;max-width:560px}
.node.t-texto small,.node.t-texto p,.node.t-texto .tstw,.node.t-texto .av{display:none}
.node.t-texto b{display:block;font-size:22px;font-weight:600;white-space:pre-wrap;color:var(--tx)}.node.t-texto.hascol b{color:var(--c)}
.node.t-texto.sel,.node.t-texto.msel{outline:1px dashed var(--ac);outline-offset:3px}
#drawbar{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:55;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:8px 12px;box-shadow:0 8px 24px #000a;max-width:96vw}
#drawbar button{padding:4px 10px}#drawbar .dc{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--ln);min-width:0}#drawbar .on{outline:2px solid var(--ac)}
body.drawing #cv{cursor:crosshair!important}#drawbtn.on{background:var(--ac);color:var(--dk)}

.nc{height:100%;overflow:hidden}
.node.t-texto b[contenteditable=true]{cursor:text;min-width:24px;outline:1px solid var(--ac);outline-offset:3px;user-select:text}
#tfbar{position:fixed;z-index:56;display:none;gap:6px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:6px 8px;box-shadow:0 8px 24px #000a}
#tfbar button{padding:3px 8px;min-width:30px}#tfbar .dc{width:22px;height:22px;border-radius:50%;padding:0;min-width:0;border:2px solid var(--ln)}#tfbar .on{outline:2px solid var(--ac)}#tfbar span{min-width:26px;text-align:center;color:var(--mu)}

#instdlg{width:min(640px,95vw);padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px}#instdlg::backdrop{background:#000b}
#instdlg .lh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}#instdlg .ld{padding:12px;display:flex;flex-direction:column;gap:8px}
#instdlg textarea{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px monospace;width:100%}#instdlg small{color:var(--mu)}
.ext{margin-top:6px;font-size:12px;color:var(--ac);cursor:pointer;font-weight:700}
#aggdlg{width:min(700px,95vw);max-height:82vh;padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px}#aggdlg::backdrop{background:#000b}
#aggdlg .lh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}#aggl{padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:calc(82vh - 52px)}

#imgdlg{width:min(900px,96vw);padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px}#imgdlg::backdrop{background:#000c}
#imgdlg .lh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
#imgdlg .chk{padding:14px;display:grid;place-items:center;background-image:conic-gradient(#6b7685 25%,#8a94a3 0 50%,#6b7685 0 75%,#8a94a3 0);background-size:22px 22px}
#imgdlg img{max-width:100%;max-height:68vh;display:block}#imgdlg small{color:var(--mu);padding:8px 12px;display:block}

#eddlg{width:min(480px,95vw);padding:0;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px}#eddlg::backdrop{background:#000b}
#eddlg .lh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}#eddlg .ld{padding:12px;display:flex;flex-direction:column;gap:8px}
#eddlg input,#eddlg select{background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;width:100%}#eddlg .lbt{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<aside id="side">
  <h1>Mesa de Campanha</h1>
  <button id="newP">Novo RPG</button>
  <div id="plist" style="display:flex;flex-direction:column;gap:4px"></div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
    <button id="reorg">Organizar mapa com IA</button>
    <button id="undo" disabled>Desfazer última mudança</button>
    <button id="tema">🎨 Tema: Padrão</button>
    <button id="cfg">Configurar IA</button>
    <button id="syncb">Sincronizar (nuvem)</button>
    <button id="exp">Exportar backup</button>
    <button id="imp">Importar backup</button>
    <input type="file" id="impf" accept=".json" hidden>
  </div>
</aside>
<div id="scrim"></div>
<div id="main">
  <div id="cv"><div id="world"><svg id="svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93a1b3"/></marker></defs></svg><svg id="svgTop"></svg></div></div>
  <div class="empty" id="empty"></div>
  <div id="tools">
    <button id="menu" aria-label="Menu">☰</button>
    <button id="srb" title="Buscar (Ctrl+K)">🔍<span class="t"> Buscar</span></button>
    <button id="add">+<span class="t"> Caixa</span></button>
    <button id="link" title="Ligar duas caixas">🔗<span class="t"> Ligar</span></button>
    <button id="tidy" title="Organizar as caixas desta camada sem sobreposição">⊞<span class="t"> Organizar</span></button>
    <button id="addtxt" title="Texto solto, sem caixa (como no Miro)">T<span class="t"> Texto</span></button>
    <button id="drawbtn" title="Desenhar à mão livre sobre o mapa e as imagens">✏<span class="t"> Desenhar</span></button>
    <button id="histbtn" title="Histórico de alterações: veja o que mudou e volte no tempo">🕘<span class="t"> Histórico</span></button>
    <button id="cmdbtn" title="Comandos globais (Ctrl+K): ex. apague todos os eventos">⌨<span class="t"> Comandos</span></button>
    <button id="libbtn" title="Biblioteca de fichas e documentos">📚<span class="t"> Biblioteca</span></button>
    <button id="hier" title="Hierarquia: lugares grandes, personagens/objetos ligados ficam ao redor, menores">◎<span class="t"> Hierarquia</span></button>
    <button id="addimg" title="Imagem solta no mapa (ou cole com Ctrl+V)">🖼<span class="t"> Imagem</span></button><input type="file" id="addimgf" accept="image/*" multiple hidden>
    <button id="fit" title="Centralizar">⤢<span class="t"> Centralizar</span></button>
    <button id="tlb" title="Linha do tempo">🕒<span class="t"> Linha do tempo</span></button>
    <button id="sfocus" style="display:none" title="Limpar destaque da sessão"></button>
    <div id="crumbs"></div>
  </div>
  <div id="panel">
    <button type="button" id="pclose">Fechar ✕</button>
    <button type="button" id="popen">Abrir por dentro ▸</button>
    <label>Tipo</label><select id="pt"></select>
    <div id="pszw"><label>Tamanho (hierarquia)</label><select id="psz"><option value="0">Mini</option><option value="1">Pequena</option><option value="2">Normal</option><option value="3">Grande</option><option value="4">Enorme</option></select><button type="button" id="porbit" style="width:100%;margin-top:6px">◎ Colocar ligados ao redor</button></div>
    <button type="button" id="plib" style="width:100%;margin-top:6px">📚 Ficha da biblioteca</button>
    <div id="pment"></div>
    <label>Título</label><input id="ptitle">
    
    <div id="f-url"><label>Link da ficha (seu webapp)</label><input id="purl" placeholder="https://seusite.com/ficha/123"><button type="button" id="purlgo" style="width:100%;margin-top:6px">↗ Abrir ficha</button></div>
    <div id="pwhenw" style="display:none"><label>Quando (linha do tempo)</label><input id="pwhen" placeholder="ex: Dia 3, noite"></div>
    <div id="f-text"><label id="lbl-text">Texto</label><textarea id="ptext" rows="6"></textarea></div>
    <div id="f-test"><label>Perícia do teste</label><input id="pskill" placeholder="Ex.: Investigação, Percepção"><label>O que cada DT revela (só aparece o que tiver texto)</label><div id="pdts" style="display:flex;flex-direction:column;gap:6px"></div><button type="button" id="pdtadd" style="width:100%">+ Adicionar DT</button></div>
    <div id="f-ses"><label id="lbl-ses">Aparece nas sessões</label><div id="pses" style="display:flex;gap:4px;flex-wrap:wrap"></div></div>
    <div id="f-img"><label>Imagem (retrato, mapa, bilhete)</label>
    <input type="file" id="pimg" accept="image/*">
    <button id="pimgx">Remover imagem</button></div>
    <button id="pdel">Apagar caixa</button>
  </div>
  <div id="msg"></div>
  <div id="bar">
    <div id="atts"></div>
    <button id="att" title="Anexar arquivos (txt, png, jpg)">📎</button><input type="file" id="attf" multiple accept=".txt,.md,text/plain,image/png,image/jpeg,image/webp" hidden>
    <button id="mic" title="Falar">Falar</button>
    <textarea id="txt" placeholder="Ex: o Barão Voss escreveu o bilhete achado na adega e é inimigo do ferreiro..."></textarea>
    <button id="send">Enviar</button>
  </div>
  <div id="tlp">
    <div class="tlh"><h1>Linha do tempo</h1><button id="tladd">+ Evento</button><button id="tlx">Fechar ✕</button></div>
    <div id="tll"></div>
  </div>
  <div id="srp">
    <div class="tlh"><input id="srq" placeholder="Buscar caixa, texto, lugar, sessão…" autocomplete="off"><button id="srx">Fechar ✕</button></div>
    <div id="srl"></div>
  </div>
</div>
<dialog id="dlg"><form method="dialog">
  <h1>Configurar IA (Groq)</h1>
  <p style="color:var(--mu)">Crie uma chave gratuita em console.groq.com. Fica guardada apenas neste navegador.</p>
  <label>Chave da API do Groq</label><input id="key" type="password" autocomplete="off">
  <p style="display:flex;gap:6px;justify-content:flex-end"><button value="x" id="ksave">Guardar</button></p>
</form></dialog>
<dialog id="dsync"><div>
  <h1>Sincronização</h1>
  <p id="sinfo" style="color:var(--mu)"></p>
  <div id="scfg" style="display:none">
    <label>URL do projeto Supabase</label><input id="surl" placeholder="https://xxxx.supabase.co">
    <label>Chave anon / publishable</label><input id="skey" type="password" autocomplete="off">
    <p style="display:flex;justify-content:flex-end"><button type="button" id="ssave">Salvar conexão</button></p>
  </div>
  <div id="sform">
    <label>E-mail</label><input id="se" type="email" autocomplete="email">
    <label>Senha (mín. 6 caracteres)</label><input id="sp" type="password" autocomplete="current-password">
    <p style="display:flex;gap:6px;justify-content:flex-end"><button type="button" id="sup">Criar conta</button><button type="button" id="sin">Entrar</button></p>
  </div>
  <p style="display:flex;gap:6px;justify-content:flex-end"><button type="button" id="sout" hidden>Sair</button><button type="button" id="snow" hidden>Sincronizar agora</button><button type="button" id="sclose">Fechar</button></p>
</div></dialog>
<dialog id="dpick"><div>
  <h1>Adicionar cena</h1>
  <label>Procurar uma caixa que já existe</label><input id="pksearch" placeholder="Buscar por título ou lugar">
  <div id="pklist"></div>
  <label>…ou criar uma caixa nova (ela também aparece no mapa)</label>
  <input id="pkname" placeholder="Título da nova caixa">
  <div style="display:flex;gap:6px;margin-top:6px"><select id="pktype"></select><select id="pkpar"></select></div>
  <p style="display:flex;gap:6px;justify-content:flex-end"><button type="button" id="pkmk">Criar e adicionar</button><button type="button" id="pkx">Concluir</button></p>
</div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async()=>{
const TYPES={personagem:['Personagem','#6fb3d9'],lugar:['Lugar','#7fc29b'],pista:['Pista / bilhete','#e0a84a'],evento:['Evento','#c58ad9'],nota:['Nota','#9aa7b5'],imagem:['Imagem','#9aa7b5'],texto:['Texto solto','#9aa7b5']};
const NUL=new Proxy(function(){},{get:(t,k)=>k===Symbol.toPrimitive?()=>'':NUL,set:()=>true,apply:()=>NUL});
const $=id=>document.getElementById(id)||NUL;
function setTema(t){if(t)document.documentElement.dataset.tema=t;else delete document.documentElement.dataset.tema;try{localStorage.setItem('tema',t||'')}catch(e){}const b=document.getElementById('tema');if(b)b.textContent='🎨 Tema: '+(t==='rosa'?'Rosa':'Padrão')}
setTema(localStorage.getItem('tema')||'');
document.getElementById('tema').onclick=()=>setTema(document.documentElement.dataset.tema==='rosa'?'':'rosa');
const NS='http://www.w3.org/2000/svg';
/* ===== SUPABASE: preencha com os dados do seu projeto (Project Settings > API) ===== */
const SB_URL='',SB_KEY='';
const sbCfg=()=>({url:SB_URL||localStorage.getItem('sb_url')||'',key:SB_KEY||localStorage.getItem('sb_key')||''});
let sb=null,user=null,pushT=null,sbAuthSet=false;
const DEF_MODEL='openai/gpt-oss-120b';
const LOCAL=['v','views','layer','sesFocus','bgHide'];   /* só deste aparelho: posição/zoom e camada aberta */
const MINK=.12;
/* armazenamento grande: IndexedDB (centenas de MB) em vez do localStorage (~5 MB) */
const idb={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open('mesa_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async get(k){const db=this.db||(this.db=await this.open());return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 async set(k,v){const db=this.db||(this.db=await this.open());return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}};
let useIDB=false,idbT=null,S,S0;
try{S0=JSON.parse(localStorage.getItem('mesa'))}catch(e){}
try{S=await idb.get('S');useIDB=true}catch(e){useIDB=false}
if(useIDB&&S0&&S0.projects&&(!S||!S.projects||(S0.t||0)>(S.t||0)))S=S0;
if(!useIDB)S=S0;
if(!S||!S.projects)S={projects:{},cur:null};
if(useIDB&&S0){try{await idb.set('S',S);localStorage.removeItem('mesa')}catch(e){useIDB=false}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function persist(){if(!useIDB){try{localStorage.setItem('mesa',JSON.stringify(S))}catch(e){say('Armazenamento cheio. Exporte um backup e use imagens menores.')}return}clearTimeout(idbT);idbT=setTimeout(flushIDB,500)}
async function flushIDB(){clearTimeout(idbT);try{await idb.set('S',S)}catch(e){console.error(e);say('Não consegui salvar no armazenamento do navegador: '+(e.message||e),6000)}}
addEventListener('pagehide',()=>{if(useIDB)flushIDB()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&useIDB)flushIDB()});
const uid=()=>Math.random().toString(36).slice(2,9);
const mob=()=>matchMedia('(max-width:700px)').matches;
const defV=()=>mob()?{x:20,y:100,k:.8}:{x:300,y:200,k:1};
const P=()=>S.projects[S.cur];
function mkProject(name){return{name,nodes:[],edges:[],tl:[],v:defV(),views:{},layer:null}}
function fixProjects(){for(const p of Object.values(S.projects)){p.nodes=p.nodes||[];p.edges=p.edges||[];p.tl=p.tl||[];p.sessions=p.sessions||[];p.v=p.v||defV();p.views=p.views||{}}}
fixProjects();
function save(){tlSync();sesSync();histCommit();S.t=Date.now();persist();if(user){clearTimeout(pushT);pushT=setTimeout(push,5000)}}
function saveView(){persist()}
function newProject(name){const id=uid();S.projects[id]=mkProject(name);S.cur=id;save();render()}
if(!S.cur||!S.projects[S.cur]){const k=Object.keys(S.projects)[0];if(k)S.cur=k;else{const id=uid();S.projects[id]=mkProject('RPG 1');S.cur=id}}
let sel=null,linkMode=null,undoSnap=null;const msel=new Set();let tfRaf=0,tfb=null,curPos=null;const H={};let hSkip=false,lastTrunc={};
function say(t,ms=3500){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',ms)}
const btn=(t,f)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=f;return b};

/* ===== camadas ===== */
const L=()=>P().layer||null;
const nodeById=id=>P().nodes.find(n=>n.id===id);
const vis=()=>{const l=L();return P().nodes.filter(n=>(n.parent||null)===l)};
const kids=id=>P().nodes.filter(n=>n.parent===id);
function chain(id){const out=[];let n=nodeById(id),g=0;while(n&&n.parent&&g++<60){const q=nodeById(n.parent);if(!q)break;out.unshift(q);n=q}return out}
const pathStr=id=>chain(id).map(n=>n.title||'Sem título').join(' › ');
function descendants(id){const out=[],st=[id];while(st.length){const c=st.pop();for(const n of P().nodes)if(n.parent===c){out.push(n.id);st.push(n.id)}}return out}
function rep(id,layer){let n=nodeById(id),g=0;while(n&&(n.parent||null)!==layer&&g++<60)n=n.parent?nodeById(n.parent):null;return n&&(n.parent||null)===layer?n.id:null}
function fixLayer(){const p=P();if(p.layer&&!nodeById(p.layer)){p.layer=null;p.v=(p.views&&p.views.root)||p.v||defV()}}
function setLayer(id){const p=P();id=id||null;if((p.layer||null)===id)return;
 p.views=p.views||{};p.views[p.layer||'root']=p.v;p.layer=id;const k=id||'root';let fresh=false;
 if(!p.views[k]){p.views[k]=defV();fresh=true}p.v=p.views[k];sel=null;pOpen=false;
 render();if(settle(null))save();if(fresh)fitView();else saveView();
 world.animate([{opacity:.2},{opacity:1}],{duration:180})}
function tlSync(){const p=S.projects&&P();if(!p)return;const ev=new Set(p.nodes.filter(n=>n.type==='evento').map(n=>n.id));const seen=new Set();
 p.tl=(p.tl||[]).filter(id=>ev.has(id)&&!seen.has(id)&&seen.add(id));
 p.nodes.forEach(n=>{if(ev.has(n.id)&&!seen.has(n.id)){p.tl.push(n.id);seen.add(n.id)}})}
const STAT={planejada:'Planejada',andamento:'Em andamento',jogada:'Jogada'};
let FS=null,sesSel=null,sesDel=null;
function sesSync(){const p=S.projects&&P();if(!p)return;p.sessions=p.sessions||[];const ok=new Set(p.nodes.map(n=>n.id));
 p.sessions.forEach(s=>{const seen=new Set();s.items=(s.items||[]).filter(i=>ok.has(i.n)&&!seen.has(i.n)&&seen.add(i.n))})}
function focusSet(){const p=P(),s=p.sessions.find(x=>x.id===p.sesFocus);if(!s)return null;const set=new Set();
 for(const i of s.items){let n=nodeById(i.n),g=0;while(n&&g++<60){set.add(n.id);n=n.parent?nodeById(n.parent):null}}return set}
function updFocusBtn(){const p=P(),s=p.sessions.find(x=>x.id===p.sesFocus),b=$('sfocus');b.style.display=s?'':'none';if(s)b.textContent='◉ '+(s.name||'Sessão')+' ✕'}
$('sfocus').onclick=()=>{P().sesFocus=null;saveView();render()};

/* ===== projetos (barra lateral) ===== */
function renderSide(){const l=$('plist');l.innerHTML='';
 for(const [id,p] of Object.entries(S.projects)){
  const d=document.createElement('div');d.className='proj';
  const b=document.createElement('button');b.textContent=p.name;if(id===S.cur)b.className='on';
  b.onclick=()=>{S.cur=id;sel=null;pOpen=false;save();render()};
  const r=document.createElement('button');r.textContent='✎';r.title='Renomear';
  r.onclick=()=>{const n=prompt('Novo nome:',p.name);if(n){p.name=n;save();renderSide();renderCrumbs()}};
  const x=document.createElement('button');x.textContent='✕';x.title='Apagar';
  x.onclick=()=>{if(Object.keys(S.projects).length<2)return say('Precisa ter ao menos um RPG.');if(confirm('Apagar "'+p.name+'"?')){delete S.projects[id];if(S.cur===id)S.cur=Object.keys(S.projects)[0];save();render()}};
  d.append(b,r,x);l.append(d)}}
$('newP').onclick=()=>{const n=prompt('Nome do novo RPG:','RPG '+(Object.keys(S.projects).length+1));if(n){newProject(n);sel=null;render()}};

/* ===== mapa ===== */

 else if((m=/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/.exec(w)))d=(+(m[3]||0))*400+(+m[2])*31+(+m[1]);
 else if((m=/\b(1[0-9]{3}|20[0-9]{2})\b/.exec(w)))d=+m[1]*400;
 for(const[k,v]of [['madrugada',1],['amanhecer',2],['manha',3],['meio-dia',4],['meio dia',4],['almoco',4],['entardecer',6],['tarde',5],['anoitecer',7],['meia-noite',8],['noite',7]])if(w.includes(k)){t=v;break}

const TLSYS=`Você é o assistente da LINHA DO TEMPO de uma campanha de RPG. Você recebe "eventos" (já na ordem atual, com sessão, quando, estado, ramifica_de e o que envolvem), "sessoes" e "outras_caixas" do mapa. Transforme o pedido em OPERAÇÕES pequenas e exatas. Devolva SOMENTE JSON: {"resposta":"1-2 frases dizendo o que entendeu e vai fazer","operacoes":[...]}.
REGRA DE OURO: faça só o que o mestre pediu de forma explícita. Se ele perguntar, pedir análise ou opinião, ou for vago, devolva "operacoes":[] e responda em "resposta". Nunca apague, recrie, renomeie ou reordene o que ele não mencionou; respeite a sessão, o estado e as ramificações que já existem. Na dúvida, não altere.
Operações permitidas (eventos por id; sessões pelo nome exato):
{"op":"mover","id":"evento","depois_de":"id do evento"|"inicio"}
{"op":"sessao_do_evento","id":"evento","sessao":"nome"|null}  (cria a sessão se o nome não existir; null tira da sessão)
{"op":"eventos_na_sessao","sessao":"nome","ids":["evento",...]}
{"op":"renomear_sessao","sessao":"nome atual","novo_nome":"..."}
{"op":"apagar_sessao","sessao":"nome"}  (só se o mestre pediu para apagar)
{"op":"ramificar","id":"evento","de":"id do evento"|null,"tipo":"alt"|"par"}
{"op":"estado","id":"evento","estado":"previsto"|"ocorreu"|"nao_ocorreu"}
{"op":"quando","id":"evento","quando":"texto"}
{"op":"ordenar_por_quando"}
Para decidir ordem use: o campo "quando" > causa e consequência nos resumos > a ordem atual. Para "dividir em N sessões", distribua os eventos principais em blocos consecutivos na ordem dada, só se o mestre pedir.`;
function mkTLState(){const p=P();tlSync();const ev=p.tl.map(nodeById).filter(Boolean),oth=p.nodes.filter(n=>['lugar','personagem','pista'].includes(n.type)),
 nbs=id=>{const t=new Set();p.edges.forEach(e=>{if(e.from===id)t.add(e.to);if(e.to===id)t.add(e.from)});return[...t].map(nodeById).filter(n=>n&&n.type!=='evento'&&n.type!=='nota').slice(0,3).map(n=>(n.title||'').slice(0,24))};let str;
 for(let lv=0;lv<5;lv++){str=JSON.stringify({eventos:ev.map(e=>{const si=sesOf(e.id);return{id:e.id,titulo:(e.title||'').slice(0,lv>=4?30:70),quando:e.when||undefined,estado:e.st==='ok'?'ocorreu':e.st==='no'?'nao_ocorreu':undefined,sessao:si>=0?p.sessions[si].name:undefined,ramifica_de:e.br&&e.br.of?e.br.of:undefined,envolve:lv<3?nbs(e.id):undefined,resumo:lv<1?((e.text||'').slice(0,110)||undefined):lv<2?((e.text||'').slice(0,50)||undefined):undefined}}),sessoes:p.sessions.map(x=>({nome:x.name,eventos:x.items.filter(i=>p.tl.includes(i.n)).length})),outras_caixas:lv<3?oth.map(n=>({tipo:n.type,titulo:(n.title||'').slice(0,60)})):undefined});if(str.length<=7500)break}
 return str}
function opsApply(ops){const p=P(),ev=x=>{x=String(x&&x.id!==undefined?x.id:x||'');if(p.tl.includes(x))return x;const n=p.nodes.find(n=>n.type==='evento'&&lnorm(n.title)===lnorm(x));return n?n.id:null};
 const sf=(x,mk)=>{if(x==null)return null;x=String(x);let q=p.sessions.find(z=>z.id===x)||p.sessions.find(z=>lnorm(z.name).trim()===lnorm(x).trim());if(!q&&mk){q={id:uid(),name:x,date:'',status:'planejada',goal:'',items:[]};p.sessions.push(q)}return q||null},

  if(o.op==='mover'){const id=ev(o.id);if(!id)continue;p.tl=p.tl.filter(x=>x!==id);const a=(o.depois_de==null||o.depois_de==='inicio')?-1:p.tl.indexOf(ev(o.depois_de));p.tl.splice(a+1,0,id)}

  else if(o.op==='eventos_na_sessao'){const q=sf(o.sessao,true);(o.ids||[]).map(ev).filter(Boolean).forEach(id=>put(id,q))}

  else if(o.op==='apagar_sessao'){const q=sf(o.sessao,false);if(q)p.sessions=p.sessions.filter(z=>z!==q)}

 const sys=`Você organiza o mapa de uma campanha de RPG de mesa em CAMADAS (fluxogramas dentro de caixas). Recebe o mapa atual e uma fala do mestre. Devolva SOMENTE JSON: {"caixas":[{"id":"id existente OU id curto novo","tipo":"personagem|lugar|pista|evento|nota","titulo":"curto","texto":"detalhes","dentro_de":"id da caixa que contém esta ('' = nível principal)","quando":"só eventos: momento curto, ex: Dia 3, noite","pos":{"x":0.3,"y":0.6}}],"ligacoes":[{"de":"id","para":"id","rotulo":"relação curta"}],"linha_do_tempo":["ids de TODOS os eventos em ordem cronológica"],"sessoes":[{"id":"id existente OU novo","nome":"curto","status":"planejada|andamento|jogada","objetivo":"1-2 frases","data":"opcional","itens":[{"id":"id de caixa","nota":"o que o mestre faz ou revela nesta sessão"}],"adicionar":[{"id":"id de caixa","nota":"..."}]}],"imagens":[{"arquivo":"nome do anexo","caixa":"id da caixa que exibe a imagem"}],"apagar":["ids"],"resposta":"1 frase confirmando"}

1. Reaproveite caixas existentes (mesmo id) em vez de duplicar; só inclua em "caixas" as novas ou alteradas; ao alterar mantenha o texto antigo e acrescente; use ids novos nas ligações para caixas novas; não apague nada sem o mestre pedir; escreva em português. Textos de caixas existentes podem vir cortados com “…”: ao alterar uma delas, devolva o texto começando exatamente pelo trecho cortado (sem o “…”) e acrescente o novo depois.
2. Camadas: toda caixa pode conter outras. "dentro_de" omitido: em caixa nova significa a camada_atual que o mestre está vendo (null = nível principal); em caixa existente não muda nada. Lugares contêm sub-lugares e os eventos que acontecem neles (crie o lugar se for citado e não existir). Personagens, organizações e pistas ficam no nível da camada atual, ligados por setas aos lugares e eventos.
3. Detalhamento: quando o mestre der vários detalhes sobre uma caixa (personagem, lugar, organização ou evento), deixe em "texto" só um resumo de 1 a 2 frases e crie caixas-filhas (dentro_de = essa caixa), uma por aspecto (ex.: Origem, Objetivo, Segredo, Aparência, Relações; ou sub-lugares, pistas e eventos do lugar). Ligue as filhas entre si por setas quando houver causa ou relação. Não invente fatos: só distribua o que o mestre disse ou o que já está escrito.
4. Eventos: sempre tipo "evento", com "quando" curto se houver pista de tempo. Sempre que criar, alterar ou reordenar eventos, devolva "linha_do_tempo" com os ids de todos os eventos (existentes e novos) em ordem cronológica provável; sem pista de tempo, mantenha a ordem atual e coloque os novos no fim.
5. Títulos com até 5 palavras. Rótulos de ligação com até 4 palavras.
6. Sessões: o mestre também organiza o que acontece em cada sessão de jogo. Uma sessão é uma lista ordenada de cenas, e cada cena é uma caixa (evento, lugar, personagem, pista...). Quando ele falar de sessões (ex: "na sessão 2 eles chegam na mansão"), devolva em "sessoes" a sessão (id existente ou novo): use "adicionar" para acrescentar cenas e "itens" (lista completa e ordenada) só para reordenar ou remover. Se citar algo que ainda não é caixa, crie a caixa em "caixas" e use o mesmo id. A "nota" guarda só o que é específico daquela sessão; o conteúdo geral fica no texto da caixa. Não crie nem altere sessões que o mestre não mencionou.`;

 const messages=[
  {role:'system',content:sys},
  {role:'user',content:'MAPA ATUAL:\n'+ms.str+'\n\nFALA DO MESTRE:\n'+text}
 ];

 const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
  method:'POST',
  headers:{
   'Content-Type':'application/json',
   'Authorization':'Bearer '+key
  },
  body:JSON.stringify({
   model:model,
   messages:messages,
   response_format:{type:'json_object'},
   max_completion_tokens:Math.max(1200,Math.floor(3000*(opts._sh||1))),
   ...(/gpt-oss/.test(model)?{reasoning_effort:'low'}:{})
  })
 });

 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(_){}console.error('Groq',r.status,m);
  const w=/try again in (?:(\d+)m)?([\d.]+)s/.exec(m),e=new Error(r.status===413?'O pedido ficou grande demais para o limite do Groq.':r.status===429?'Limite gratuito do Groq atingido. Aguarde um minuto e tente novamente.':r.status===401?'Chave da API do Groq inválida. Verifique nas definições.':'Erro '+r.status+(m?': '+m.slice(0,120):''));
  const lm=/Limit (\d+),? Requested (\d+)/i.exec(m);if(lm){e.limit=+lm[1];e.req=+lm[2]}e.status=r.status;e.wait=w?Math.ceil((+w[1]||0)*60+ +w[2])+1:20;throw e}
 const j=await r.json();let o;
 try{o=JSON.parse(j.choices[0].message.content.replace(/```json|```/g,''));if(Array.isArray(o))o=o[0]}
 catch(e){console.error(e);throw new Error('A resposta da IA veio incompleta. Tente novamente.')}
 snap();applyAI(o,p,opts);return true};
 
/* divide textos grandes em partes e respeita o limite por minuto do Groq */
const ask=async(text,opts={})=>{let rest=String(text).trim(),head='',shrink=1,n=0;
 const h=rest.search(/^[ \t]*Nome:/m);if(h>0&&h<1200){head=rest.slice(0,h).trim()+'\n\n';rest=rest.slice(h)}
 while(rest){
  const room=Math.max(500,Math.floor(9500*shrink-3600-mkState(rest,Math.floor(4000*shrink)).str.length-head.length-200));let chunk;
  if(rest.length<=room)chunk=rest;
  else{chunk='';for(const q of rest.split(/(?=^[ \t]*Nome:)/m)){if(chunk&&(chunk+q).length>room)break;chunk+=q}
   if(chunk.length>room){const c=rest.slice(0,room),i=Math.max(c.lastIndexOf('\n\n'),c.lastIndexOf('\n'),c.lastIndexOf(' '));chunk=c.slice(0,i>room*.5?i:room)}}
  rest=rest.slice(chunk.length);let again=false;
  for(let a=0;;a++){
   try{await askOnce(head+chunk,{...opts,_sh:shrink});break}
   catch(e){
    if(e.status===413&&shrink>.2){shrink*=(e.limit&&e.req?Math.min(.8,e.limit/e.req*.85):.6);rest=chunk+rest;again=true;break}
    if(e.status===413)throw new Error('O pedido continua grande demais para o limite do Groq'+(e.limit?' (limite '+e.limit+', pedido '+e.req+' tokens)':'')+'. O mapa está grande: tente um texto mais curto.');
    if(e.status===429&&a<3&&(e.wait||20)<=70){for(let s=e.wait||20;s>0;s--){say('Limite por minuto do Groq: continuando em '+s+'s…',1500);await new Promise(r=>setTimeout(r,1000))}continue}
    throw e}}
  if(again)continue;n++;if(rest)say('Parte '+n+' aplicada. Enviando a próxima…',3000)}
 return true};

function applyAI(o,p,opts){
 const l0=L(),map={},newIds=[];
 const byTitle=t=>t?p.nodes.find(n=>n.title&&n.title.toLowerCase()===String(t).toLowerCase()):null;
 const rs=k=>{if(k===''||k==null)return null;return map[k]||(nodeById(k)||byTitle(k)||{}).id||null};
 const cs=(o.caixas||[]).filter(c=>c&&typeof c==='object');
 for(const c of cs){let n=nodeById(c.id)||byTitle(c.titulo);
  if(n){if(c.titulo)n.title=c.titulo;if(c.texto!==undefined){let t=String(c.texto);const tp=lastTrunc[n.id];if(tp!==undefined&&n.text){const t2=t.replace(/…$/,'');if(t2.startsWith(tp))t=n.text+t2.slice(tp.length);else if(n.text.startsWith(t2))t=n.text}n.text=t}if(TYPES[c.tipo])n.type=c.tipo;if(c.quando)n.when=c.quando}
  else{n={id:uid(),type:TYPES[c.tipo]?c.tipo:'nota',title:c.titulo||'Sem título',text:c.texto||'',x:0,y:0,nw:true};if(c.quando)n.when=c.quando;if(c.pos&&isFinite(+c.pos.x)&&isFinite(+c.pos.y))n.pos={x:+c.pos.x,y:+c.pos.y};p.nodes.push(n);newIds.push(n.id)}
  map[c.id]=n.id}
 for(const c of cs){const n=nodeById(map[c.id]);if(!n)continue;let pid;const d=c.dentro_de;
  if(d===undefined)pid=n.nw?l0:undefined;
  else if(d===''||d===null)pid=null;
  else{const r=rs(d);pid=(r&&r!==n.id&&!descendants(n.id).includes(r))?r:(n.nw?l0:undefined)}
  if(pid!==undefined){const old=n.parent||null;if(old!==pid&&!n.nw)n.mv=true;if(pid)n.parent=pid;else delete n.parent}}
 const eds=[];for(const l of o.ligacoes||[]){const a=rs(l.de),b=rs(l.para);if(a&&b&&a!==b&&!p.edges.some(e=>e.from===a&&e.to===b&&e.label===l.rotulo)&&!eds.some(e=>e.from===a&&e.to===b&&e.label===(l.rotulo||''))){eds.push({id:uid(),from:a,to:b,label:l.rotulo||''})}}
 p.edges.push(...eds);
 for(const id of o.apagar||[]){const t=rs(id)||id;if(nodeById(t))delNode(t)}
 if(opts.replaceSessions&&(o.sessoes||[]).length){p.sessions=[];p.sesFocus=null}
 for(const s of o.sessoes||[]){if(!s||typeof s!=='object')continue;
  let ss=p.sessions.find(x=>x.id===s.id)||p.sessions.find(x=>s.nome&&lnorm(x.name).trim()===lnorm(s.nome).trim());
  if(!ss){ss={id:uid(),name:s.nome||'Sessão '+(p.sessions.length+1),date:'',status:'planejada',goal:'',items:[]};p.sessions.push(ss)}
  if(s.nome)ss.name=s.nome;if(s.objetivo!==undefined)ss.goal=s.objetivo;if(s.data!==undefined)ss.date=s.data;if(STAT[s.status])ss.status=s.status;
  const norm=a=>(Array.isArray(a)?a:[]).map(i=>typeof i==='string'?{id:i}:i).filter(i=>i&&i.id);
  if(Array.isArray(s.itens)){const old=Object.fromEntries(ss.items.map(i=>[i.n,i.note])),seen=new Set();
   ss.items=norm(s.itens).map(i=>{const n=rs(i.id);return{n,note:i.nota!==undefined?i.nota:(old[n]||'')}}).filter(i=>i.n&&!seen.has(i.n)&&seen.add(i.n))}
  for(const i of norm(s.adicionar)){const n=rs(i.id);if(!n)continue;const ex=ss.items.find(x=>x.n===n);if(ex){if(i.nota!==undefined)ex.note=i.nota}else ss.items.push({n,note:i.nota||''})}}
 const imgs=(opts.files||[]).filter(f=>f.kind==='img');
 for(const im of o.imagens||[]){if(!im)continue;const nm=String(im.arquivo||'').toLowerCase(),f=imgs.find(f=>f.name.toLowerCase()===nm)||(imgs.length===1?imgs[0]:null),id=rs(im.caixa),n=id&&nodeById(id);if(f&&n){n.img=f.thumb;n.bgAsp=f.aspect}}
 /* posiciona o que é novo ou foi movido para outra camada */
 const byLayer=new Map();
 for(const n of p.nodes.filter(n=>n.nw||n.mv)){const lay=n.parent||null;if(!byLayer.has(lay))byLayer.set(lay,[]);byLayer.get(lay).push(n)}
 let posLayer=null;
 for(const[lay,arr]of byLayer){const flagged=new Set(arr.map(n=>n.id)),base=p.nodes.filter(n=>(n.parent||null)===lay&&!flagged.has(n.id));
  const wp=arr.filter(n=>n.pos),rest=arr.filter(n=>!n.pos);
  if(wp.length){const cont=lay?nodeById(lay):null;let W=2200,H=1500;if(cont&&cont.bg){W=cont.bg.w;H=cont.bg.h}
   if(cont&&cont.bgAsp){W=2200;H=Math.round(W*cont.bgAsp);cont.bg={w:W,h:H}}
   wp.forEach(n=>{n.x=Math.round(Math.min(1,Math.max(0,n.pos.x))*W-95);n.y=Math.round(Math.min(1,Math.max(0,n.pos.y))*H-45)});
   if(lay&&lay!==l0&&!posLayer)posLayer=lay}
  if(!wp.length&&!base.length&&rest.length>1){rest.forEach((n,i)=>{n.x=(i%4)*260;n.y=Math.floor(i/4)*200});tidyLayer(lay)}
  else{const unplaced=new Set(rest.map(n=>n.id));
   for(const n of rest){unplaced.delete(n.id);let anchor=null;
    for(const e of p.edges){const o2=e.from===n.id?e.to:e.to===n.id?e.from:null;if(o2&&(p.nodes.find(m=>m.id===o2)||{}).parent===(lay||undefined)&&!unplaced.has(o2)&&o2!==n.id){anchor=o2;break}}
    [n.x,n.y]=free(anchor,lay,n,unplaced)}}
  separate(p.nodes.filter(n=>(n.parent||null)===lay),null,wp.length?40:26)}
 p.nodes.forEach(n=>{delete n.nw;delete n.mv;delete n.pos;delete n.bgAsp});
 tlSync();
 if(Array.isArray(o.linha_do_tempo)){const order=o.linha_do_tempo.map(rs).filter(id=>id&&nodeById(id)&&nodeById(id).type==='evento');p.tl=[...new Set([...order,...p.tl])]}
 save();render();if(settle(null))save();
 if($('sesp').style.display==='flex')renderSes();
 if(posLayer){setLayer(posLayer);fitView()}
 const out=posLayer?0:newIds.filter(id=>{const n=nodeById(id);return n&&(n.parent||null)!==L()}).length;
 const off=newIds.some(id=>{const n=nodeById(id);if(!n||(n.parent||null)!==L())return false;const v=P().v,sx=n.x*v.k+v.x,sy=n.y*v.k+v.y;return sx<0||sy<0||sx>cv.clientWidth-60||sy>cv.clientHeight-100});
 if(opts.fit||off)fitView();
 say((o.resposta||'Mapa atualizado.')+(posLayer?' Abri a camada do mapa: use ⌂ no topo para voltar.':'')+(out?' ('+out+' ficaram dentro de outras caixas: toque duas vezes na caixa para abrir.)':''),out?7000:3500)}
async function go(){let t=$('txt').value.trim();if(!t&&!atts.length)return;if(!t)t=ATT_DEFAULT;if(rec)rec.stop();
 $('send').disabled=true;$('send').textContent='...';if(atts.length)say('A IA está analisando os anexos… pode levar um pouco.',60000);
 try{if(await ask(t,{files:atts.slice()})){$('txt').value='';atts=[];renderAtts()}}catch(e){say(e.message||'Falha ao falar com a IA.',6000)}
 $('send').disabled=false;$('send').textContent='Enviar'}
$('send').onclick=go;
$('txt').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))go()};
$('reorg').onclick=async()=>{if(!confirm('A IA vai reorganizar o mapa inteiro: mover itens para dentro dos lugares, dividir textos longos em caixas menores e montar a linha do tempo. Dá para desfazer pelo menu. Continuar?'))return;
 say('A IA está reorganizando o mapa… pode levar até 1 minuto.',120000);$('reorg').disabled=true;
 try{await ask(REORG,{fit:true})}catch(e){say(e.message||'Falha ao falar com a IA.',7000)}
 $('reorg').disabled=false};
$('cfg').onclick=()=>{$('key').value=localStorage.getItem('gkey')||'';$('dlg').showModal()};
$('ksave').onclick=()=>{localStorage.setItem('gkey',$('key').value.trim())};

/* ===== voz ===== */
let rec=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{if(!SR)return say('Seu navegador não tem reconhecimento de voz. Use o Chrome.');
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('txt').value+=(($('txt').value&&' ')+e.results[i][0].transcript.trim())};
 rec.onend=()=>{rec=null;$('mic').classList.remove('on');$('mic').textContent='Falar'};
 rec.onerror=()=>{};rec.start();$('mic').classList.add('on');$('mic').textContent='Parar'};
render();

/* ===== sincronização (Supabase) ===== */
const hasSB=()=>{const c=sbCfg();return !!(c.url&&c.key&&window.supabase)};
function updSyncUI(){
 const on=!!user,has=hasSB();
 $('scfg').style.display=(SB_URL&&SB_KEY)?'none':'block';
 $('sform').hidden=on||!has;$('sout').hidden=!on;$('snow').hidden=!on;
 $('sinfo').textContent=!has?'Informe a URL e a chave do seu projeto Supabase para ativar a nuvem.':on?'Conectado como '+user.email+'. Alterações são enviadas automaticamente.':'Entre com a mesma conta no celular e no PC para compartilhar os dados.';
 $('syncb').textContent=on?'Nuvem: conectado':'Sincronizar (nuvem)'}
const stripV=o=>JSON.parse(JSON.stringify(o,(k,x)=>LOCAL.includes(k)?undefined:x));
function useRemote(d,t){for(const k in H)delete H[k];const old={};for(const[id,p]of Object.entries(S.projects)){old[id]={};LOCAL.forEach(k=>old[id][k]=p[k])}let fit=false;
 S=d;S.t=t;fixProjects();if(!S.projects[S.cur])S.cur=Object.keys(S.projects)[0];
 for(const[id,p]of Object.entries(S.projects)){const o=old[id];if(o&&o.v){LOCAL.forEach(k=>{if(o[k]!==undefined)p[k]=o[k]});p.views=p.views||{}}else{p.v=defV();p.views={};p.layer=null;fit=true}}
 saveView();sel=null;pOpen=false;render();if(fit)fitView()}
async function gz(o){const j=JSON.stringify(o);if(typeof CompressionStream==='undefined')return o;const buf=new Uint8Array(await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let b='';for(let i=0;i<buf.length;i+=32768)b+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return{z:1,b:btoa(b)}}
async function ungz(d){if(!d||!d.z)return d;const bin=atob(d.b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return JSON.parse(await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
let pushing=false,pushAgain=false;
async function push(){
 if(!sb||!user)return;if(pushing){pushAgain=true;return}pushing=true;
 try{const t=S.t||(S.t=Date.now()),data=await gz(stripV(S));let err=null;
  for(let a=0;a<3;a++){const r=await sb.from('mesa_data').upsert({user_id:user.id,data,t});err=r.error;if(!err)break;if(!/timeout|fetch|network/i.test(err.message||''))break;await new Promise(r=>setTimeout(r,2500*(a+1)))}
  if(err)throw err;localStorage.setItem('mesa_link','1')}
 catch(e){console.error(e);const m=e.message||String(e);say(/timeout/i.test(m)?'A nuvem demorou demais para receber os dados (provavelmente imagens pesadas). Veja a solução no chat ou reduza as imagens.':'Falha ao enviar para a nuvem: '+m,9000)}
 finally{pushing=false;if(pushAgain){pushAgain=false;push()}}}
async function pull(){
 if(!sb||!user)return;
 try{
  const {data,error}=await sb.from('mesa_data').select('data,t').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(data)data.data=await ungz(data.data);
  if(!data){await push();return}
  if(!localStorage.getItem('mesa_link')){
   if(confirm('Já existem dados desta conta na nuvem.\nOK = usar os dados da nuvem (substitui os deste aparelho)\nCancelar = enviar os dados deste aparelho para a nuvem')){useRemote(data.data,data.t);localStorage.setItem('mesa_link','1');say('Dados da nuvem carregados.')}
   else{await push()}
   return}
  if(data.t>(S.t||0)){useRemote(data.data,data.t);say('Atualizado com a versão da nuvem.')}
  else if(data.t<(S.t||0))await push()
 }catch(e){console.error(e);say('Falha ao sincronizar: '+(e.message||e),5000)}}
async function initSync(){
 updSyncUI();if(!hasSB())return;const c=sbCfg();
 sb=supabase.createClient(c.url,c.key);
 const {data}=await sb.auth.getSession();user=data.session?data.session.user:null;updSyncUI();
 if(!sbAuthSet){sbAuthSet=true;sb.auth.onAuthStateChange((_e,ses)=>{user=ses?ses.user:null;updSyncUI()})}
 if(user)pull()}
$('syncb').onclick=()=>{updSyncUI();$('dsync').showModal()};
$('sclose').onclick=()=>$('dsync').close();
$('ssave').onclick=async()=>{const u=$('surl').value.trim(),k=$('skey').value.trim();if(!u||!k)return say('Preencha a URL e a chave.');
 localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);await initSync();say('Conexão salva. Agora entre ou crie sua conta.')};
$('snow').onclick=async()=>{await pull();say('Sincronizado.')};
async function auth(kind){
 if(!sb)return say('Informe a URL e a chave do Supabase primeiro.',5000);
 const email=$('se').value.trim(),password=$('sp').value;
 if(!email||password.length<6)return say('Informe e-mail e uma senha de 6+ caracteres.');
 const r=kind==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return say(r.error.message,6000);
 if(!r.data.session)return say('Conta criada. Confirme o e-mail e depois clique em Entrar.',7000);
 user=r.data.session.user;$('sp').value='';updSyncUI();$('dsync').close();await pull()}
$('sin').onclick=()=>auth('in');$('sup').onclick=()=>auth('up');
$('sout').onclick=async()=>{await sb.auth.signOut();user=null;localStorage.removeItem('mesa_link');updSyncUI();$('dsync').close()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
initSync();
})();
